#cloud-config
#
# GrapheneOS GSI - ephemeral GitHub Actions runner bootstrap
#
# Placeholders replaced by the GHA "provision" job before sending to DO API:
#   __RUNNER_TOKEN__   - one-time GHA runner registration token
#   __RUNNER_LABELS__  - comma-separated labels for this runner
#   __REPO_URL__       - https://github.com/OWNER/REPO
#   __SSH_KEY_B64__    - base64-encoded BUILD_SSH_KEY private key

package_update: true
package_upgrade: false

packages:
  - bc
  - bison
  - build-essential
  - ccache
  - curl
  - flex
  - g++-multilib
  - gcc-multilib
  - git
  - git-lfs
  - gnupg
  - gperf
  - imagemagick
  - jq
  - lib32readline-dev
  - lib32z1-dev
  - liblz4-tool
  - libssl-dev
  - libxml2
  - libxml2-utils
  - lzop
  - openjdk-11-jdk
  - pngcrush
  - podman
  - python3
  - rsync
  - schedtool
  - squashfs-tools
  - unzip
  - wget
  - xsltproc
  - xz-utils
  - zip
  - zlib1g-dev

write_files:
  - path: /root/.ssh/build_key
    permissions: '0600'
    encoding: b64
    content: __SSH_KEY_B64__

runcmd:
  # -------------------------------------------------------------------------
  # SAFETY TIMER - armed first, always.
  # Shuts the droplet down after 9 hours regardless of anything else.
  # GHA teardown job will destroy it cleanly long before this fires.
  # -------------------------------------------------------------------------
  - shutdown -P +540 "SAFETY: 9-hour maximum build time reached. Self-destructing."

  # -------------------------------------------------------------------------
  # SSH key - used for private vendor repo + rsync to build.chrisaw.io
  # -------------------------------------------------------------------------
  - |
    ssh-keygen -y -f /root/.ssh/build_key > /root/.ssh/build_key.pub
    chmod 644 /root/.ssh/build_key.pub
    cat > /root/.ssh/config <<'EOF'
    Host github.com
      IdentityFile /root/.ssh/build_key
      StrictHostKeyChecking no
      User git

    Host build.chrisaw.io
      IdentityFile /root/.ssh/build_key
      StrictHostKeyChecking no
    EOF
    chmod 600 /root/.ssh/config

  # -------------------------------------------------------------------------
  # libncurses5 - not in Ubuntu 24.04 repos, required by AOSP host tools
  # -------------------------------------------------------------------------
  - |
    cd /var/tmp
    curl -sf -O http://launchpadlibrarian.net/648013231/libtinfo5_6.4-2_amd64.deb
    dpkg -i libtinfo5_6.4-2_amd64.deb
    curl -sf -LO http://launchpadlibrarian.net/648013227/libncurses5_6.4-2_amd64.deb
    dpkg -i libncurses5_6.4-2_amd64.deb
    rm -f ./*.deb

  # -------------------------------------------------------------------------
  # repo tool
  # -------------------------------------------------------------------------
  - |
    curl -sf -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
    chmod a+x /usr/local/bin/repo

  # -------------------------------------------------------------------------
  # GitHub CLI - for creating releases
  # -------------------------------------------------------------------------
  - |
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
      | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
    chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
      > /etc/apt/sources.list.d/github-cli.list
    apt-get update -qq && apt-get install -y gh

  # -------------------------------------------------------------------------
  # git identity (required for patch application via git am)
  # -------------------------------------------------------------------------
  - |
    git config --global user.email 'androidbuild@localhost'
    git config --global user.name 'androidbuild'
    git config --global color.ui false

  # -------------------------------------------------------------------------
  # GitHub Actions runner
  # -------------------------------------------------------------------------
  - |
    RUNNER_VERSION=$(curl -sf https://api.github.com/repos/actions/runner/releases/latest \
      | jq -r '.tag_name' | sed 's/^v//')
    mkdir -p /opt/actions-runner
    curl -sf -L \
      "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz" \
      | tar -xz -C /opt/actions-runner
    /opt/actions-runner/bin/installdependencies.sh

  - |
    cd /opt/actions-runner
    ./config.sh \
      --url "__REPO_URL__" \
      --token "__RUNNER_TOKEN__" \
      --name "do-gsi-build-$(hostname)" \
      --labels "__RUNNER_LABELS__" \
      --work /root/actions-runner-work \
      --unattended \
      --ephemeral

  - |
    cd /opt/actions-runner
    # Run the runner as a background service so cloud-init can exit
    nohup ./run.sh >> /var/log/actions-runner.log 2>&1 &
    echo "GitHub Actions runner started (pid=$!)"
