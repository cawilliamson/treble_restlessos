name: Build RestlessOS GSI

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'release channel for auto-detection (stable/beta/alpha)'
        required: false
        default: 'stable'
      debug_build:
        description: 'enable debug patches (verbose logging, open logcat) -- do not ship'
        required: false
        type: boolean
        default: false
      _retry_attempt:
        description: 'internal: spot retry counter (do not set manually)'
        required: false
        default: '0'

permissions:
  actions: write
  contents: write

# ---------------------------------------------------------------------------
# tuneable knobs -- change these here rather than hunting through the yaml
# ---------------------------------------------------------------------------
env:
  EC2_BUILD_INSTANCE_TYPE: c7i.48xlarge   # big spot instance for compilation
  EC2_BUILD_ROOT_VOLUME_GB: 100
  EC2_DATA_VOLUME_DEVICE: /dev/sdf
  EC2_DATA_VOLUME_LABEL: builddata
  EC2_DATA_VOLUME_MOUNT: /mnt/src
  EC2_DEFAULT_REGION: eu-west-2
  EC2_PROJECT_TAG: gsi-build
  EC2_SIGN_INSTANCE_TYPE: m7i.xlarge      # cheap on-demand for signing/compress/upload
  EC2_SIGN_ROOT_VOLUME_GB: 30
  EC2_SPOT_DEADLINE_MINUTES: 60
  EC2_SYNC_DATA_VOLUME_GB: 1000
  EC2_SYNC_INSTANCE_TYPE: m7i.xlarge    # cheap on-demand for repo sync
  EC2_SYNC_ROOT_VOLUME_GB: 30
  RSYNC_TRANSFER_TIMEOUT_SECONDS: 120
  RUNNER_WAIT_ATTEMPTS: 60
  RUNNER_WAIT_INTERVAL_SECONDS: 15
  SPOT_RETRY_MAX_ATTEMPTS: 5

# only one build at a time - spot instances are expensive
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # job 1: provision-sync
  # launches a cheap EC2 on-demand instance for repo sync, with an attached
  # EBS data volume. on-demand chosen to avoid spot interruption during the
  # long sync phase. the volume will be detached and handed off to the build
  # instance after sync completes.
  # ---------------------------------------------------------------------------
  provision-sync:
    name: Provision Sync Instance
    runs-on: ubuntu-latest
    outputs:
      instance_id: ${{ steps.launch.outputs.instance_id }}
      runner_label: ${{ steps.runner_label.outputs.label }}
      region: ${{ steps.launch.outputs.region }}
      subnet_id: ${{ steps.launch.outputs.subnet_id }}
      data_volume_id: ${{ steps.get_info.outputs.data_volume_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false
          lfs: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.EC2_DEFAULT_REGION }}

      - name: Generate unique runner label
        id: runner_label
        run: |
          LABEL="${{ env.EC2_PROJECT_TAG }}-sync-${{ github.run_id }}"
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"
          echo "Runner label: ${LABEL}"

      - name: Get GitHub Actions runner registration token
        id: runner_token
        run: |
          RESPONSE=$(curl --fail --request POST --silent \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token")
          TOKEN=$(echo "$RESPONSE" | jq --raw-output '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: failed to get runner registration token"
            echo "$RESPONSE" | jq .
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Render cloud-init user-data
        run: |
          SSH_KEY_B64=$(echo "${{ secrets.BUILD_SSH_KEY }}" | base64 --wrap=0)
          REPO_URL="https://github.com/${{ github.repository }}"
          RUNNER_LABEL="${{ steps.runner_label.outputs.label }}"
          RUNNER_TOKEN="${{ steps.runner_token.outputs.token }}"

          sed \
            --expression "s|__REPO_URL__|${REPO_URL}|g" \
            --expression "s|__RUNNER_LABELS__|${RUNNER_LABEL}|g" \
            --expression "s|__RUNNER_TOKEN__|${RUNNER_TOKEN}|g" \
            --expression "s|__SSH_KEY_B64__|${SSH_KEY_B64}|g" \
            .github/cloud-init/user-data-sync.yml \
            > /tmp/user-data-sync.yml

          echo "user-data rendered: $(wc --bytes < /tmp/user-data-sync.yml) bytes"

      - name: Launch EC2 on-demand instance
        id: launch
        run: |
          # on-demand: no spot pricing, no retry loop. capacity is always
          # available for a small instance type, or the launch fails outright.
          CANDIDATE_REGIONS="${{ env.EC2_DEFAULT_REGION }} eu-west-1"

          for REGION in ${CANDIDATE_REGIONS}; do
            echo "=== Trying ${REGION} ==="

            AMI_ID=$(aws ec2 describe-images --region "${REGION}" \
              --filters \
                "Name=name,Values=ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-amd64-server-*" \
                "Name=state,Values=available" \
              --output text \
              --owners '099720109477' \
              --query 'Images | sort_by(@, &CreationDate) | [-1].ImageId')

            SG_ID=$(aws ec2 describe-security-groups --region "${REGION}" \
              --filters "Name=group-name,Values=${{ env.EC2_PROJECT_TAG }}" "Name=tag:Project,Values=${{ env.EC2_PROJECT_TAG }}" \
              --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null) || true

            SUBNET_ID=$(aws ec2 describe-subnets --region "${REGION}" \
              --filters "Name=tag:Project,Values=${{ env.EC2_PROJECT_TAG }}" \
              --query 'Subnets[0].SubnetId' --output text 2>/dev/null) || true

            if [ -z "${AMI_ID}" ] || [ -z "${SG_ID}" ] || [ "${SG_ID}" = "None" ] || [ -z "${SUBNET_ID}" ] || [ "${SUBNET_ID}" = "None" ]; then
              echo "  Missing AMI/SG/subnet in ${REGION} (ami=${AMI_ID:-none} sg=${SG_ID:-none} subnet=${SUBNET_ID:-none}), skipping"
              continue
            fi
            echo "  AMI: ${AMI_ID}, SG: ${SG_ID}, subnet: ${SUBNET_ID}"

            INSTANCE_ID=$(aws ec2 run-instances --region "${REGION}" \
              --image-id "${AMI_ID}" \
              --instance-initiated-shutdown-behavior terminate \
              --instance-type ${{ env.EC2_SYNC_INSTANCE_TYPE }} \
              --output text \
              --query 'Instances[0].InstanceId' \
              --security-group-ids "${SG_ID}" \
              --subnet-id "${SUBNET_ID}" \
              --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=${{ env.EC2_PROJECT_TAG }}-sync-${{ github.run_id }}},{Key=Project,Value=${{ env.EC2_PROJECT_TAG }}},{Key=Ephemeral,Value=true}]" \
              --block-device-mappings \
                "DeviceName=/dev/sda1,Ebs={VolumeSize=${{ env.EC2_SYNC_ROOT_VOLUME_GB }},VolumeType=gp3,DeleteOnTermination=true}" \
                "DeviceName=${{ env.EC2_DATA_VOLUME_DEVICE }},Ebs={VolumeSize=${{ env.EC2_SYNC_DATA_VOLUME_GB }},VolumeType=gp3,DeleteOnTermination=true}" \
              --user-data "file:///tmp/user-data-sync.yml" 2>&1) && break

            echo "  Launch failed: ${INSTANCE_ID}"
            INSTANCE_ID=""
          done

          if [ -z "${INSTANCE_ID}" ]; then
            echo "ERROR: failed to launch sync on-demand instance in any region"
            exit 1
          fi

          {
            echo "instance_id=${INSTANCE_ID}"
            echo "region=${REGION}"
            echo "subnet_id=${SUBNET_ID}"
          } >> "$GITHUB_OUTPUT"
          echo "Launched sync on-demand instance: ${INSTANCE_ID} (${{ env.EC2_SYNC_INSTANCE_TYPE }} in ${REGION})"

      - name: Wait for instance to reach running state
        run: |
          echo "Waiting for sync instance ${{ steps.launch.outputs.instance_id }} to start..."
          aws ec2 wait instance-running \
            --region "${{ steps.launch.outputs.region }}" \
            --instance-ids "${{ steps.launch.outputs.instance_id }}"
          echo "Instance is running"

      - name: Get data volume ID
        id: get_info
        run: |
          # EBS volume attachment is async -- block device mappings may not
          # be populated the instant the instance reaches "running" state
          DATA_VOLUME_ID=""
          for ATTEMPT in $(seq 1 10); do
            DATA_VOLUME_ID=$(aws ec2 describe-instances \
              --region "${{ steps.launch.outputs.region }}" \
              --instance-ids "${{ steps.launch.outputs.instance_id }}" \
              --query "Reservations[0].Instances[0].BlockDeviceMappings[?DeviceName!=\`/dev/sda1\`].Ebs.VolumeId" \
              --output text 2>/dev/null)
            if [ -n "${DATA_VOLUME_ID}" ] && [ "${DATA_VOLUME_ID}" != "None" ]; then
              break
            fi
            echo "Waiting for data volume to appear in block device mappings... (attempt ${ATTEMPT}/10)"
            sleep 5
          done

          if [ -z "${DATA_VOLUME_ID}" ] || [ "${DATA_VOLUME_ID}" = "None" ]; then
            echo "ERROR: data volume not found on sync instance after 10 attempts"
            aws ec2 describe-instances \
              --region "${{ steps.launch.outputs.region }}" \
              --instance-ids "${{ steps.launch.outputs.instance_id }}" \
              --query 'Reservations[0].Instances[0].BlockDeviceMappings' \
              --output table
            exit 1
          fi
          echo "data_volume_id=${DATA_VOLUME_ID}" >> "$GITHUB_OUTPUT"
          echo "Data volume: ${DATA_VOLUME_ID}"

      - name: Wait for runner to register with GitHub Actions
        run: |
          LABEL="${{ steps.runner_label.outputs.label }}"
          echo "Waiting for runner with label '${LABEL}' to register..."

          for i in $(seq 1 ${{ env.RUNNER_WAIT_ATTEMPTS }}); do
            ONLINE=$(curl --fail --silent \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runners" \
              | jq --arg label "$LABEL" --raw-output \
                '[.runners[] | select(.labels[].name == $label) | select(.status == "online")] | length')

            echo "  attempt ${i}/${{ env.RUNNER_WAIT_ATTEMPTS }}: ${ONLINE} runner(s) online with label '${LABEL}'"

            if [ "${ONLINE}" -ge 1 ] 2>/dev/null; then
              echo "Sync runner is online and ready"
              exit 0
            fi
            sleep ${{ env.RUNNER_WAIT_INTERVAL_SECONDS }}
          done

          echo "ERROR: sync runner never came online after $(( ${{ env.RUNNER_WAIT_ATTEMPTS }} * ${{ env.RUNNER_WAIT_INTERVAL_SECONDS }} / 60 )) minutes"
          exit 1

  # ---------------------------------------------------------------------------
  # job 2: sync
  # runs on the cheap sync instance. fetches sources, then flushes and
  # unmounts the data volume for detach/attach handoff to the build instance.
  # ---------------------------------------------------------------------------
  sync:
    name: Sync Sources
    needs: provision-sync
    runs-on: [ self-hosted, "${{ needs.provision-sync.outputs.runner_label }}" ]
    timeout-minutes: 180

    outputs:
      grapheneos_tag: ${{ steps.resolve_tag.outputs.tag }}
      android_version: ${{ steps.parse_version.outputs.android_version }}
      android_version_tag: ${{ steps.parse_version.outputs.android_version_tag }}

    env:
      GRAPHENEOS_RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || 'stable' }}

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v6
        with:
          clean: false
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Mount data volume
        run: |
          # identify the data volume by its AWS volume ID, which is known from
          # the provision-sync job. on EBS/NVMe instances the controller serial
          # is the volume ID with dashes stripped.
          DATA_VOLUME_ID="${{ needs.provision-sync.outputs.data_volume_id }}"
          if [ -z "${DATA_VOLUME_ID}" ] || [ "${DATA_VOLUME_ID}" = "None" ]; then
            echo "ERROR: data_volume_id not provided by provision-sync job"
            exit 1
          fi
          EXPECTED_SERIAL=$(echo "${DATA_VOLUME_ID}" | tr -d '-')
          echo "Looking for data volume ${DATA_VOLUME_ID} (NVMe serial ${EXPECTED_SERIAL})"

          # never touch the root volume; derive its top-level device from the
          # mountpoint of /
          ROOT_DEV=$(findmnt -n -o SOURCE / 2>/dev/null | sed 's|^/dev/||;s|p[0-9]*$||' || true)
          echo "Root disk: /dev/${ROOT_DEV:-unknown}"

          DATA_DEV=""
          for i in $(seq 1 30); do
            for ctrl in /sys/class/nvme/nvme*; do
              [ -d "${ctrl}" ] || continue
              ctrl_name=$(basename "${ctrl}")
              dev_node="${ctrl_name}n1"
              [ "${dev_node}" = "${ROOT_DEV}" ] && continue
              serial=$(tr -d '[:space:]' < "${ctrl}/serial" 2>/dev/null || true)
              if [ "${serial}" = "${EXPECTED_SERIAL}" ]; then
                DATA_DEV="${dev_node}"
                break 2
              fi
            done
            echo "Waiting for data volume to appear... (attempt ${i}/30)"
            sleep 5
          done

          if [ -z "${DATA_DEV}" ]; then
            echo "ERROR: data volume device not found for ${DATA_VOLUME_ID}"
            echo "--- /sys/class/nvme serials ---"
            for ctrl in /sys/class/nvme/nvme*; do
              [ -e "${ctrl}/serial" ] || continue
              echo "$(basename "${ctrl}"): $(cat "${ctrl}/serial")"
            done
            echo "--- lsblk ---"
            lsblk
            echo "--- root mount ---"
            findmnt -n -o SOURCE /
            exit 1
          fi
          echo "Data volume device: /dev/${DATA_DEV}"

          # udisks2 may auto-mount the data volume; unmount before mkfs
          MOUNT_POINT=$(lsblk -n -o MOUNTPOINT "/dev/${DATA_DEV}" 2>/dev/null | grep -v "^$" | head -1 || true)
          if [ -n "${MOUNT_POINT}" ]; then
            echo "udisks2 auto-mounted ${DATA_DEV} at ${MOUNT_POINT} -- unmounting"
            sudo umount "${MOUNT_POINT}"
          fi

          # format with ext4 and a label for easy mounting on later instances
          sudo mkfs.ext4 -L ${{ env.EC2_DATA_VOLUME_LABEL }} "/dev/${DATA_DEV}"

          sudo mkdir -p ${{ env.EC2_DATA_VOLUME_MOUNT }}
          sudo mount "/dev/${DATA_DEV}" ${{ env.EC2_DATA_VOLUME_MOUNT }}
          sudo chown github:github ${{ env.EC2_DATA_VOLUME_MOUNT }}
          echo "Data volume mounted at ${{ env.EC2_DATA_VOLUME_MOUNT }}"

      - name: Set up source directory
        run: |
          ln -s ${{ env.EC2_DATA_VOLUME_MOUNT }} src
          echo "src/ symlinked to ${{ env.EC2_DATA_VOLUME_MOUNT }}"

      - name: Resolve latest GrapheneOS tag
        id: resolve_tag
        run: |
          echo "Fetching latest ${GRAPHENEOS_RELEASE_CHANNEL} tag from grapheneos.org/releases..."
          RELEASES_HTML=$(curl --fail --silent "https://grapheneos.org/releases")
          TAG=$(echo "${RELEASES_HTML}" \
            | grep --only-matching --perl-regexp "id=[a-z]+-${GRAPHENEOS_RELEASE_CHANNEL}><td>[^<]+</td><td><a href=#\K[0-9]{10}" \
            | sort --numeric-sort --reverse | head --lines=1)
          if [ -z "${TAG}" ]; then
            echo "ERROR: failed to extract a valid ${GRAPHENEOS_RELEASE_CHANNEL} tag"
            exit 1
          fi
          echo "Resolved latest ${GRAPHENEOS_RELEASE_CHANNEL} tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Initialise repo
        working-directory: src/
        run: |
          GRAPHENEOS_TAG="${{ steps.resolve_tag.outputs.tag }}"
          echo "Initialising from tag: ${GRAPHENEOS_TAG}"
          repo init --depth=1 --git-lfs \
            --manifest-branch "refs/tags/${GRAPHENEOS_TAG}" \
            --manifest-url https://github.com/GrapheneOS/platform_manifest.git
          mkdir --parents .repo/local_manifests
          cp --verbose ${{ github.workspace }}/configs/manifests/*.xml .repo/local_manifests/

      - name: Sync sources
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 120
          max_attempts: 20
          retry_wait_seconds: 30
          command: |
            cd src/
            SYNC_JOBS=$(( $(nproc --all) > 16 ? 16 : $(nproc --all) ))
            echo "Syncing with ${SYNC_JOBS} parallel jobs..."
            repo sync --force-sync --jobs=${SYNC_JOBS} --no-clone-bundle --no-tags

      - name: Parse version info
        id: parse_version
        working-directory: src/
        run: |
          AOSP_TAG=$(grep --max-count=1 "aosp_revision:" .repo/manifests/config.yml | sed "s/.*: *//")
          ANDROID_VERSION=$(echo "${AOSP_TAG}" | sed "s/android-//;s/_r.*//")
          echo "Detected ANDROID_VERSION: ${ANDROID_VERSION}"
          echo "android_version=${ANDROID_VERSION}" >> "$GITHUB_OUTPUT"
          ANDROID_VERSION_TAG=$(grep --max-count=1 "target:" build/release/release_config_map.textproto \
            | sed "s/.*\"\([^\"]*\)\".*/\1/")
          echo "Detected ANDROID_VERSION_TAG: ${ANDROID_VERSION_TAG}"
          echo "android_version_tag=${ANDROID_VERSION_TAG}" >> "$GITHUB_OUTPUT"

      - name: Flush and unmount data volume
        run: |
          sync
          # lazy unmount: the self-hosted runner may still hold the mount
          # namespace open (cwd, file descriptors, repo locks) even though no
          # further writes are happening. a lazy detach is safe because we have
          # already synced and the next instance will re-attach the volume.
          if ! sudo umount -l ${{ env.EC2_DATA_VOLUME_MOUNT }}; then
            echo "WARN: lazy umount failed, dumping holders for diagnostics"
            sudo lsof +D ${{ env.EC2_DATA_VOLUME_MOUNT }} 2>/dev/null || true
            sudo fuser -v ${{ env.EC2_DATA_VOLUME_MOUNT }} 2>/dev/null || true
            exit 1
          fi
          echo "Data volume flushed and unmounted -- ready for detach"

  # ---------------------------------------------------------------------------
  # job 3: provision-build
  # detaches the data volume from the sync instance, launches the big build
  # instance in the same AZ, and attaches the volume to it.
  # ---------------------------------------------------------------------------
  provision-build:
    name: Provision Build Instance
    needs: [provision-sync, sync]
    runs-on: ubuntu-latest
    outputs:
      instance_id: ${{ steps.launch.outputs.instance_id }}
      runner_label: ${{ steps.runner_label.outputs.label }}
      region: ${{ needs.provision-sync.outputs.region }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false
          lfs: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.provision-sync.outputs.region }}

      - name: Detach data volume from sync instance
        run: |
          DATA_VOLUME_ID="${{ needs.provision-sync.outputs.data_volume_id }}"
          REGION="${{ needs.provision-sync.outputs.region }}"

          # --force is safe: the sync job unmounts the volume before finishing,
          # and the volume is no longer being written to at this point
          for ATTEMPT in $(seq 1 3); do
            echo "Detach attempt ${ATTEMPT}/3..."
            if aws ec2 detach-volume \
              --region "${REGION}" \
              --volume-id "${DATA_VOLUME_ID}" \
              --force; then
              break
            fi
            if [ "${ATTEMPT}" -eq 3 ]; then
              echo "ERROR: detach failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done

          echo "Waiting for volume ${DATA_VOLUME_ID} to become available..."
          if ! aws ec2 wait volume-available \
            --region "${REGION}" \
            --volume-ids "${DATA_VOLUME_ID}"; then
            STATE=$(aws ec2 describe-volumes \
              --region "${REGION}" \
              --volume-ids "${DATA_VOLUME_ID}" \
              --query 'Volumes[0].State' --output text 2>/dev/null || echo "unknown")
            echo "ERROR: volume stuck in state '${STATE}' after detach"
            exit 1
          fi

          echo "Volume ${DATA_VOLUME_ID} is available and ready for attach"

      # deprovision the sync instance early -- it's idle from here until
      # teardown. the runner deregisters itself (ephemeral). if this fails,
      # the teardown job will terminate it later.
      - name: Terminate sync instance
        run: |
          SYNC_INSTANCE="${{ needs.provision-sync.outputs.instance_id }}"
          REGION="${{ needs.provision-sync.outputs.region }}"
          if [ -n "${SYNC_INSTANCE}" ] && [ "${SYNC_INSTANCE}" != "" ]; then
            echo "Terminating sync instance ${SYNC_INSTANCE} (no longer needed)..."
            aws ec2 terminate-instances \
              --region "${REGION}" \
              --instance-ids "${SYNC_INSTANCE}" || true
          fi

      - name: Generate unique runner label
        id: runner_label
        run: |
          LABEL="${{ env.EC2_PROJECT_TAG }}-build-${{ github.run_id }}"
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"
          echo "Runner label: ${LABEL}"

      - name: Get GitHub Actions runner registration token
        id: runner_token
        run: |
          RESPONSE=$(curl --fail --request POST --silent \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token")
          TOKEN=$(echo "$RESPONSE" | jq --raw-output '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: failed to get runner registration token"
            echo "$RESPONSE" | jq .
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Render cloud-init user-data
        run: |
          SSH_KEY_B64=$(echo "${{ secrets.BUILD_SSH_KEY }}" | base64 --wrap=0)
          REPO_URL="https://github.com/${{ github.repository }}"
          RUNNER_LABEL="${{ steps.runner_label.outputs.label }}"
          RUNNER_TOKEN="${{ steps.runner_token.outputs.token }}"

          sed \
            --expression "s|__REPO_URL__|${REPO_URL}|g" \
            --expression "s|__RUNNER_LABELS__|${RUNNER_LABEL}|g" \
            --expression "s|__RUNNER_TOKEN__|${RUNNER_TOKEN}|g" \
            --expression "s|__SSH_KEY_B64__|${SSH_KEY_B64}|g" \
            .github/cloud-init/user-data-build.yml \
            > /tmp/user-data-build.yml

          echo "user-data rendered: $(wc --bytes < /tmp/user-data-build.yml) bytes"

      - name: Launch EC2 spot instance
        id: launch
        run: |
          REGION="${{ needs.provision-sync.outputs.region }}"
          SUBNET_ID="${{ needs.provision-sync.outputs.subnet_id }}"
          echo "Launching build instance in ${REGION} subnet ${SUBNET_ID}..."

          # discover AMI and SG in the sync region
          AMI_ID=$(aws ec2 describe-images --region "${REGION}" \
            --filters \
              "Name=name,Values=ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-amd64-server-*" \
              "Name=state,Values=available" \
            --output text \
            --owners '099720109477' \
            --query 'Images | sort_by(@, &CreationDate) | [-1].ImageId')

          if [ -z "${AMI_ID}" ]; then
            echo "ERROR: no AMI found in ${REGION}"
            exit 1
          fi
          echo "AMI: ${AMI_ID}"

          SG_ID=$(aws ec2 describe-security-groups --region "${REGION}" \
            --filters "Name=group-name,Values=${{ env.EC2_PROJECT_TAG }}" "Name=tag:Project,Values=${{ env.EC2_PROJECT_TAG }}" \
            --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null) || true

          if [ -z "${SG_ID}" ] || [ "${SG_ID}" = "None" ]; then
            echo "ERROR: security group ${{ env.EC2_PROJECT_TAG }} not found in ${REGION}"
            exit 1
          fi
          echo "Security group: ${SG_ID}"

          # launch in the same subnet as the sync instance (volume is AZ-scoped)
          INSTANCE_ID=""
          ATTEMPT=0
          DEADLINE=$((SECONDS + ${{ env.EC2_SPOT_DEADLINE_MINUTES }} * 60))

          while [ -z "$INSTANCE_ID" ] && [ "$SECONDS" -lt "$DEADLINE" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt ${ATTEMPT}: trying subnet ${SUBNET_ID}..."

            INSTANCE_ID=$(aws ec2 run-instances --region "${REGION}" \
              --image-id "${AMI_ID}" \
              --instance-initiated-shutdown-behavior terminate \
              --instance-market-options '{"MarketType":"spot","SpotOptions":{"SpotInstanceType":"one-time","InstanceInterruptionBehavior":"terminate"}}' \
              --instance-type ${{ env.EC2_BUILD_INSTANCE_TYPE }} \
              --output text \
              --query 'Instances[0].InstanceId' \
              --security-group-ids "${SG_ID}" \
              --subnet-id "${SUBNET_ID}" \
              --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=${{ env.EC2_PROJECT_TAG }}-build-${{ github.run_id }}},{Key=Project,Value=${{ env.EC2_PROJECT_TAG }}},{Key=Ephemeral,Value=true}]" \
              --block-device-mappings \
                "DeviceName=/dev/sda1,Ebs={VolumeSize=${{ env.EC2_BUILD_ROOT_VOLUME_GB }},VolumeType=gp3,DeleteOnTermination=true}" \
              --user-data "file:///tmp/user-data-build.yml" 2>&1) && {
                break
              }
            echo "  failed: ${INSTANCE_ID}"
            INSTANCE_ID=""

            REMAINING=$(( (DEADLINE - SECONDS) / 60 ))
            echo "Subnet failed — retrying in 30s (${REMAINING}m remaining)..."
            sleep 30
          done

          if [ -z "${INSTANCE_ID}" ]; then
            echo "ERROR: failed to launch build spot instance in ${REGION}/${SUBNET_ID} after ${{ env.EC2_SPOT_DEADLINE_MINUTES }} minutes"
            exit 1
          fi

          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          echo "Launched build spot instance: ${INSTANCE_ID} (${{ env.EC2_BUILD_INSTANCE_TYPE }} in ${REGION}/${SUBNET_ID})"

      - name: Wait for instance to reach running state
        run: |
          echo "Waiting for build instance ${{ steps.launch.outputs.instance_id }} to start..."
          aws ec2 wait instance-running \
            --region ${{ needs.provision-sync.outputs.region }} \
            --instance-ids "${{ steps.launch.outputs.instance_id }}"
          echo "Instance is running"

      - name: Attach data volume to build instance
        run: |
          DATA_VOLUME_ID="${{ needs.provision-sync.outputs.data_volume_id }}"
          BUILD_INSTANCE_ID="${{ steps.launch.outputs.instance_id }}"
          REGION="${{ needs.provision-sync.outputs.region }}"

          for ATTEMPT in $(seq 1 3); do
            echo "Attach attempt ${ATTEMPT}/3..."
            if aws ec2 attach-volume \
              --region "${REGION}" \
              --volume-id "${DATA_VOLUME_ID}" \
              --instance-id "${BUILD_INSTANCE_ID}" \
              --device "${{ env.EC2_DATA_VOLUME_DEVICE }}"; then
              break
            fi
            if [ "${ATTEMPT}" -eq 3 ]; then
              echo "ERROR: attach failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done

          echo "Waiting for volume ${DATA_VOLUME_ID} to be in-use..."
          if ! aws ec2 wait volume-in-use \
            --region "${REGION}" \
            --volume-ids "${DATA_VOLUME_ID}"; then
            echo "ERROR: volume not in-use after attach"
            aws ec2 describe-volumes \
              --region "${REGION}" \
              --volume-ids "${DATA_VOLUME_ID}" \
              --query 'Volumes[0].Attachments' --output table 2>/dev/null || true
            exit 1
          fi

          echo "Volume attached and in-use"

      - name: Wait for runner to register with GitHub Actions
        run: |
          LABEL="${{ steps.runner_label.outputs.label }}"
          echo "Waiting for runner with label '${LABEL}' to register..."

          for i in $(seq 1 ${{ env.RUNNER_WAIT_ATTEMPTS }}); do
            ONLINE=$(curl --fail --silent \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runners" \
              | jq --arg label "$LABEL" --raw-output \
                '[.runners[] | select(.labels[].name == $label) | select(.status == "online")] | length')

            echo "  attempt ${i}/${{ env.RUNNER_WAIT_ATTEMPTS }}: ${ONLINE} runner(s) online with label '${LABEL}'"

            if [ "${ONLINE}" -ge 1 ] 2>/dev/null; then
              echo "Build runner is online and ready"
              exit 0
            fi
            sleep ${{ env.RUNNER_WAIT_INTERVAL_SECONDS }}
          done

          echo "ERROR: build runner never came online after $(( ${{ env.RUNNER_WAIT_ATTEMPTS }} * ${{ env.RUNNER_WAIT_INTERVAL_SECONDS }} / 60 )) minutes"
          exit 1

  # ---------------------------------------------------------------------------
  # job 4: build
  # compiles the ROM on the big EC2 spot instance and leaves the output on
  # the EBS data volume for the later sign instance.
  # ---------------------------------------------------------------------------
  build:
    name: Build ROM
    needs: [provision-build, sync]
    runs-on: [ self-hosted, "${{ needs.provision-build.outputs.runner_label }}" ]
    timeout-minutes: 120

    outputs:
      android_version: ${{ needs.sync.outputs.android_version }}
      android_version_tag: ${{ needs.sync.outputs.android_version_tag }}
      build_datetime: ${{ steps.metadata.outputs.build_datetime }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      grapheneos_tag: ${{ needs.sync.outputs.grapheneos_tag }}

    env:
      DEBUG_BUILD: ${{ github.event.inputs.debug_build || 'false' }}
      GRAPHENEOS_RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || 'stable' }}

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v6
        with:
          clean: false
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Mount data volume
        run: |
          # the volume was labelled during sync; find it by label with a
          # retry loop since NVMe device enumeration can lag behind attach
          for i in $(seq 1 30); do
            DATA_DEV=$(findfs LABEL=${{ env.EC2_DATA_VOLUME_LABEL }} 2>/dev/null) && break
            echo "Waiting for data volume to appear... (attempt $i/30)"
            sleep 5
          done

          if [ -z "${DATA_DEV}" ]; then
            echo "ERROR: data volume with label '${{ env.EC2_DATA_VOLUME_LABEL }}' not found after 30 attempts"
            echo "--- lsblk -f ---"
            lsblk -f 2>/dev/null || true
            echo "--- blkid ---"
            blkid 2>/dev/null || true
            echo "--- /proc/partitions ---"
            cat /proc/partitions
            echo "--- nvme list ---"
            nvme list 2>/dev/null || true
            echo "--- volume attachments (from metadata) ---"
            TOKEN=$(curl --silent --fail \
              --header "X-aws-ec2-metadata-token-ttl-seconds: 60" \
              --header "X-aws-ec2-metadata-token: $(curl --silent --fail \
                --request PUT 'http://169.254.169.254/latest/api/token' \
                --header 'X-aws-ec2-metadata-token-ttl-seconds: 60' 2>/dev/null)" \
              'http://169.254.169.254/latest/meta-data/block-device-mapping/' 2>/dev/null || echo "")
            if [ -n "${TOKEN}" ]; then
              echo "${TOKEN}"
            fi
            exit 1
          fi
          echo "Data volume device: ${DATA_DEV}"

          sudo mkdir -p ${{ env.EC2_DATA_VOLUME_MOUNT }}
          if ! sudo mount "${DATA_DEV}" ${{ env.EC2_DATA_VOLUME_MOUNT }}; then
            echo "ERROR: mount failed for ${DATA_DEV} on ${{ env.EC2_DATA_VOLUME_MOUNT }}"
            dmesg --since "5 minutes ago" | tail --lines=20
            exit 1
          fi
          sudo chown github:github ${{ env.EC2_DATA_VOLUME_MOUNT }}
          echo "Data volume mounted at ${{ env.EC2_DATA_VOLUME_MOUNT }}"

      - name: Set up source directory
        run: |
          ln -s ${{ env.EC2_DATA_VOLUME_MOUNT }} src
          echo "src/ symlinked to ${{ env.EC2_DATA_VOLUME_MOUNT }}"

      - name: Record build metadata
        id: metadata
        run: |
          BUILD_DATETIME=$(date "+%s")
          BUILD_NUMBER=$(date "+%Y%m%d%H%M")
          {
            echo "BUILD_DATETIME=${BUILD_DATETIME}"
            echo "BUILD_NUMBER=${BUILD_NUMBER}"
            echo "GRAPHENEOS_TAG=${{ needs.sync.outputs.grapheneos_tag }}"
            echo "ANDROID_VERSION=${{ needs.sync.outputs.android_version }}"
            echo "ANDROID_VERSION_TAG=${{ needs.sync.outputs.android_version_tag }}"
          } >> "$GITHUB_ENV"
          echo "build_datetime=${BUILD_DATETIME}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Build metadata:"
          echo "  tag:      ${{ needs.sync.outputs.grapheneos_tag }}"
          echo "  android:  ${{ needs.sync.outputs.android_version }}"
          echo "  tag val:  ${{ needs.sync.outputs.android_version_tag }}"

      - name: Set up output directory
        run: |
          mkdir --parents out/

      - name: Apply patches
        working-directory: src/
        run: |
          ${{ github.workspace }}/patches/apply.sh . trebledroid
          ${{ github.workspace }}/patches/apply.sh . trebledroid-staging
          ${{ github.workspace }}/patches/apply.sh . rom
          ${{ github.workspace }}/patches/apply.sh . personal
          if [ "${DEBUG_BUILD}" = "true" ]; then
            echo "*** DEBUG BUILD: applying debug-builds tier ***"
            ${{ github.workspace }}/patches/apply.sh . debug-builds
          else
            echo "*** RELEASE BUILD: applying release-builds tier ***"
            ${{ github.workspace }}/patches/apply.sh . release-builds
          fi

      - name: Build TrebleApp
        working-directory: src/treble_app
        run: bash build.sh release

      - name: Build ROM image
        working-directory: src/
        run: |
          pushd device/phh/treble
            cp --force --verbose ${{ github.workspace }}/configs/rom/rom.mk .
            bash generate.sh rom
          popd
          . build/envsetup.sh
          BUILD_VARIANT="user"
          if [ "${DEBUG_BUILD}" = "true" ]; then
            BUILD_VARIANT="userdebug"
          fi
          lunch "treble_arm64_bvN-${ANDROID_VERSION_TAG}-${BUILD_VARIANT}"
          make systemimage -j"$(nproc --all)"
          make target-files-package otatools -j"$(nproc --all)"

      - name: Flush and unmount data volume
        run: |
          sync
          # lazy unmount: the self-hosted runner may still hold the mount
          # namespace open (cwd, file descriptors, repo locks) even though no
          # further writes are happening. a lazy detach is safe because we have
          # already synced and the next instance will re-attach the volume.
          if ! sudo umount -l ${{ env.EC2_DATA_VOLUME_MOUNT }}; then
            echo "WARN: lazy umount failed, dumping holders for diagnostics"
            sudo lsof +D ${{ env.EC2_DATA_VOLUME_MOUNT }} 2>/dev/null || true
            sudo fuser -v ${{ env.EC2_DATA_VOLUME_MOUNT }} 2>/dev/null || true
            exit 1
          fi
          echo "Data volume flushed and unmounted -- ready for sign instance handoff"


  # ---------------------------------------------------------------------------
  # job 5: provision-sign
  # detaches the data volume from the build instance, terminates the big build
  # instance, then launches a cheap on-demand sign instance and attaches the
  # volume to it.
  # ---------------------------------------------------------------------------
  provision-sign:
    name: Provision Sign Instance
    needs: [provision-sync, provision-build, build]
    runs-on: ubuntu-latest
    outputs:
      instance_id: ${{ steps.launch.outputs.instance_id }}
      runner_label: ${{ steps.runner_label.outputs.label }}
      region: ${{ needs.provision-sync.outputs.region }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false
          lfs: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.provision-sync.outputs.region }}

      - name: Detach data volume from build instance
        run: |
          DATA_VOLUME_ID="${{ needs.provision-sync.outputs.data_volume_id }}"
          REGION="${{ needs.provision-sync.outputs.region }}"

          for ATTEMPT in $(seq 1 3); do
            echo "Detach attempt ${ATTEMPT}/3..."
            if aws ec2 detach-volume \
              --region "${REGION}" \
              --volume-id "${DATA_VOLUME_ID}" \
              --force; then
              break
            fi
            if [ "${ATTEMPT}" -eq 3 ]; then
              echo "ERROR: detach failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done

          echo "Waiting for volume ${DATA_VOLUME_ID} to become available..."
          if ! aws ec2 wait volume-available \
            --region "${REGION}" \
            --volume-ids "${DATA_VOLUME_ID}"; then
            STATE=$(aws ec2 describe-volumes \
              --region "${REGION}" \
              --volume-ids "${DATA_VOLUME_ID}" \
              --query 'Volumes[0].State' --output text 2>/dev/null || echo "unknown")
            echo "ERROR: volume stuck in state '${STATE}' after detach"
            exit 1
          fi

          echo "Volume ${DATA_VOLUME_ID} is available and ready for sign instance"

      - name: Terminate build instance
        run: |
          BUILD_INSTANCE="${{ needs.provision-build.outputs.instance_id }}"
          REGION="${{ needs.provision-sync.outputs.region }}"
          if [ -n "${BUILD_INSTANCE}" ] && [ "${BUILD_INSTANCE}" != "" ]; then
            echo "Terminating build instance ${BUILD_INSTANCE} (compilation complete)..."
            aws ec2 terminate-instances \
              --region "${REGION}" \
              --instance-ids "${BUILD_INSTANCE}" || true
          fi

      - name: Generate unique runner label
        id: runner_label
        run: |
          LABEL="${{ env.EC2_PROJECT_TAG }}-sign-${{ github.run_id }}"
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"
          echo "Runner label: ${LABEL}"

      - name: Get GitHub Actions runner registration token
        id: runner_token
        run: |
          RESPONSE=$(curl --fail --request POST --silent \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token")
          TOKEN=$(echo "$RESPONSE" | jq --raw-output '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: failed to get runner registration token"
            echo "$RESPONSE" | jq .
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Render cloud-init user-data
        run: |
          SSH_KEY_B64=$(echo "${{ secrets.BUILD_SSH_KEY }}" | base64 --wrap=0)
          REPO_URL="https://github.com/${{ github.repository }}"
          RUNNER_LABEL="${{ steps.runner_label.outputs.label }}"
          RUNNER_TOKEN="${{ steps.runner_token.outputs.token }}"

          sed \
            --expression "s|__REPO_URL__|${REPO_URL}|g" \
            --expression "s|__RUNNER_LABELS__|${RUNNER_LABEL}|g" \
            --expression "s|__RUNNER_TOKEN__|${RUNNER_TOKEN}|g" \
            --expression "s|__SSH_KEY_B64__|${SSH_KEY_B64}|g" \
            .github/cloud-init/user-data-build.yml \
            > /tmp/user-data-sign.yml

          echo "user-data rendered: $(wc --bytes < /tmp/user-data-sign.yml) bytes"

      - name: Launch EC2 on-demand sign instance
        id: launch
        run: |
          REGION="${{ needs.provision-sync.outputs.region }}"
          SUBNET_ID="${{ needs.provision-sync.outputs.subnet_id }}"
          echo "Launching sign instance in ${REGION} subnet ${SUBNET_ID}..."

          AMI_ID=$(aws ec2 describe-images --region "${REGION}" \
            --filters \
              "Name=name,Values=ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-amd64-server-*" \
              "Name=state,Values=available" \
            --output text \
            --owners '099720109477' \
            --query 'Images | sort_by(@, &CreationDate) | [-1].ImageId')

          if [ -z "${AMI_ID}" ]; then
            echo "ERROR: no AMI found in ${REGION}"
            exit 1
          fi
          echo "AMI: ${AMI_ID}"

          SG_ID=$(aws ec2 describe-security-groups --region "${REGION}" \
            --filters "Name=group-name,Values=${{ env.EC2_PROJECT_TAG }}" "Name=tag:Project,Values=${{ env.EC2_PROJECT_TAG }}" \
            --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null) || true

          if [ -z "${SG_ID}" ] || [ "${SG_ID}" = "None" ]; then
            echo "ERROR: security group ${{ env.EC2_PROJECT_TAG }} not found in ${REGION}"
            exit 1
          fi
          echo "Security group: ${SG_ID}"

          INSTANCE_ID=$(aws ec2 run-instances --region "${REGION}" \
            --image-id "${AMI_ID}" \
            --instance-initiated-shutdown-behavior terminate \
            --instance-type ${{ env.EC2_SIGN_INSTANCE_TYPE }} \
            --output text \
            --query 'Instances[0].InstanceId' \
            --security-group-ids "${SG_ID}" \
            --subnet-id "${SUBNET_ID}" \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=${{ env.EC2_PROJECT_TAG }}-sign-${{ github.run_id }}},{Key=Project,Value=${{ env.EC2_PROJECT_TAG }},{Key=Ephemeral,Value=true}]" \
            --block-device-mappings \
              "DeviceName=/dev/sda1,Ebs={VolumeSize=${{ env.EC2_SIGN_ROOT_VOLUME_GB }},VolumeType=gp3,DeleteOnTermination=true}" \
            --user-data "file:///tmp/user-data-sign.yml" 2>&1) || {
              echo "ERROR: failed to launch sign instance: ${INSTANCE_ID}"
              exit 1
            }

          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          echo "Launched sign on-demand instance: ${INSTANCE_ID} (${{ env.EC2_SIGN_INSTANCE_TYPE }} in ${REGION}/${SUBNET_ID})"

      - name: Wait for instance to reach running state
        run: |
          echo "Waiting for sign instance ${{ steps.launch.outputs.instance_id }} to start..."
          aws ec2 wait instance-running \
            --region ${{ needs.provision-sync.outputs.region }} \
            --instance-ids "${{ steps.launch.outputs.instance_id }}"
          echo "Instance is running"

      - name: Attach data volume to sign instance
        run: |
          DATA_VOLUME_ID="${{ needs.provision-sync.outputs.data_volume_id }}"
          SIGN_INSTANCE_ID="${{ steps.launch.outputs.instance_id }}"
          REGION="${{ needs.provision-sync.outputs.region }}"

          for ATTEMPT in $(seq 1 3); do
            echo "Attach attempt ${ATTEMPT}/3..."
            if aws ec2 attach-volume \
              --region "${REGION}" \
              --volume-id "${DATA_VOLUME_ID}" \
              --instance-id "${SIGN_INSTANCE_ID}" \
              --device "${{ env.EC2_DATA_VOLUME_DEVICE }}"; then
              break
            fi
            if [ "${ATTEMPT}" -eq 3 ]; then
              echo "ERROR: attach failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done

          echo "Waiting for volume ${DATA_VOLUME_ID} to be in-use..."
          if ! aws ec2 wait volume-in-use \
            --region "${REGION}" \
            --volume-ids "${DATA_VOLUME_ID}"; then
            echo "ERROR: volume not in-use after attach"
            aws ec2 describe-volumes \
              --region "${REGION}" \
              --volume-ids "${DATA_VOLUME_ID}" \
              --query 'Volumes[0].Attachments' --output table 2>/dev/null || true
            exit 1
          fi

          echo "Volume attached and in-use"

      - name: Wait for runner to register with GitHub Actions
        run: |
          LABEL="${{ steps.runner_label.outputs.label }}"
          echo "Waiting for runner with label '${LABEL}' to register..."

          for i in $(seq 1 ${{ env.RUNNER_WAIT_ATTEMPTS }}); do
            ONLINE=$(curl --fail --silent \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runners" \
              | jq --arg label "$LABEL" --raw-output \
                '[.runners[] | select(.labels[].name == $label) | select(.status == "online")] | length')

            echo "  attempt ${i}/${{ env.RUNNER_WAIT_ATTEMPTS }}: ${ONLINE} runner(s) online with label '${LABEL}'"

            if [ "${ONLINE}" -ge 1 ] 2>/dev/null; then
              echo "Sign runner is online and ready"
              exit 0
            fi
            sleep ${{ env.RUNNER_WAIT_INTERVAL_SECONDS }}
          done

          echo "ERROR: sign runner never came online after $(( ${{ env.RUNNER_WAIT_ATTEMPTS }} * ${{ env.RUNNER_WAIT_INTERVAL_SECONDS }} / 60 )) minutes"
          exit 1

  # ---------------------------------------------------------------------------
  # job 6: sign
  # signs, compresses, uploads and releases the build from a small instance.
  # ---------------------------------------------------------------------------
  sign:
    name: Sign and Release
    needs: [provision-sign, build]
    runs-on: [ self-hosted, "${{ needs.provision-sign.outputs.runner_label }}" ]
    timeout-minutes: 120

    env:
      GH_TOKEN: ${{ github.token }}
      DEBUG_BUILD: ${{ github.event.inputs.debug_build || 'false' }}
      WEB_DIR: /var/www/build.chrisaw.io

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v6
        with:
          clean: false
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Mount data volume
        run: |
          for i in $(seq 1 30); do
            DATA_DEV=$(findfs LABEL=${{ env.EC2_DATA_VOLUME_LABEL }} 2>/dev/null) && break
            echo "Waiting for data volume to appear... (attempt $i/30)"
            sleep 5
          done

          if [ -z "${DATA_DEV}" ]; then
            echo "ERROR: data volume with label '${{ env.EC2_DATA_VOLUME_LABEL }}' not found after 30 attempts"
            echo "--- lsblk -f ---"
            lsblk -f 2>/dev/null || true
            echo "--- blkid ---"
            blkid 2>/dev/null || true
            echo "--- /proc/partitions ---"
            cat /proc/partitions
            echo "--- nvme list ---"
            nvme list 2>/dev/null || true
            exit 1
          fi
          echo "Data volume device: ${DATA_DEV}"

          sudo mkdir -p ${{ env.EC2_DATA_VOLUME_MOUNT }}
          if ! sudo mount "${DATA_DEV}" ${{ env.EC2_DATA_VOLUME_MOUNT }}; then
            echo "ERROR: mount failed for ${DATA_DEV} on ${{ env.EC2_DATA_VOLUME_MOUNT }}"
            dmesg --since "5 minutes ago" | tail --lines=20
            exit 1
          fi
          sudo chown github:github ${{ env.EC2_DATA_VOLUME_MOUNT }}
          echo "Data volume mounted at ${{ env.EC2_DATA_VOLUME_MOUNT }}"

      - name: Set up source directory
        run: |
          ln -s ${{ env.EC2_DATA_VOLUME_MOUNT }} src
          echo "src/ symlinked to ${{ env.EC2_DATA_VOLUME_MOUNT }}"

      - name: Restore build metadata
        run: |
          {
            echo "BUILD_DATETIME=${{ needs.build.outputs.build_datetime }}"
            echo "BUILD_NUMBER=${{ needs.build.outputs.build_number }}"
            echo "GRAPHENEOS_TAG=${{ needs.build.outputs.grapheneos_tag }}"
            echo "ANDROID_VERSION=${{ needs.build.outputs.android_version }}"
            echo "ANDROID_VERSION_TAG=${{ needs.build.outputs.android_version_tag }}"
          } >> "$GITHUB_ENV"
          echo "Restored build metadata:"
          echo "  tag:      ${{ needs.build.outputs.grapheneos_tag }}"
          echo "  android:  ${{ needs.build.outputs.android_version }}"
          echo "  tag val:  ${{ needs.build.outputs.android_version_tag }}"
          echo "  datetime: ${{ needs.build.outputs.build_datetime }}"
          echo "  number:   ${{ needs.build.outputs.build_number }}"

      - name: Set up output directory
        run: |
          mkdir --parents out/

      - name: Verify gh CLI authentication
        run: gh auth status

      - name: Sign ROM image
        working-directory: src/
        run: |
          . build/envsetup.sh
          BUILD_VARIANT="user"
          if [ "${DEBUG_BUILD}" = "true" ]; then
            BUILD_VARIANT="userdebug"
          fi
          lunch "treble_arm64_bvN-${ANDROID_VERSION_TAG}-${BUILD_VARIANT}"
          bash vendor/cawilliamson-priv/keys/sign.sh
          rm --force --verbose "${OUT}/system.img"
          unzip --jump --quiet "${OUT}/signed-target_files.zip" IMAGES/system.img -d "${OUT}/"
          rm --force --verbose "${OUT}/signed-target_files.zip"
          mv --verbose "${OUT}/system.img" "${{ github.workspace }}/out/system.img"

      - name: Compress ROM image
        id: compress
        run: |
          VERSION_TAG="${ANDROID_VERSION}-${BUILD_NUMBER}"
          if [ "${DEBUG_BUILD}" = "true" ]; then
            VERSION_TAG="${VERSION_TAG}-debug"
          fi
          cd out/
          img="RestlessOS-arm64-ab-${VERSION_TAG}.img"
          mv --verbose system.img "${img}"
          mkdir --parents zsync
          zsyncmake -o "zsync/${img}.zsync" -u "${img}" -v "${img}"
          cp --verbose "${img}" "zsync/${img}"
          xz --best --compress --memlimit-compress=0 --threads=0 --verbose "${img}"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=RestlessOS-ab-${VERSION_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          VERSION_TAG="${{ steps.compress.outputs.version_tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v -- '-debug$' | grep -v "^${VERSION_TAG}$" | head -1)
          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..HEAD"
            HEADER="Changes since ${PREV_TAG}"
          else
            RANGE="HEAD"
            HEADER="Changes"
          fi
          {
            echo "## ${HEADER}"
            echo ""
            git log --format='- %s' --no-merges "${RANGE}"
          } > out/CHANGELOG.md
          cat out/CHANGELOG.md

      - name: Upload artifacts to build.chrisaw.io
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 10
          retry_wait_seconds: 30
          command: |
            RELEASE_NAME="${{ steps.compress.outputs.release_name }}"
            REMOTE="build.chrisaw.io:/var/www/build.chrisaw.io/${RELEASE_NAME}"
            rsync --archive --compress --mkpath --verbose \
              --timeout=${{ env.RSYNC_TRANSFER_TIMEOUT_SECONDS }} \
              --partial --partial-dir=.rsync-partial \
              out/*.img.xz out/CHANGELOG.md "${REMOTE}/"
            rsync --archive --compress --mkpath --verbose \
              --timeout=${{ env.RSYNC_TRANSFER_TIMEOUT_SECONDS }} \
              --partial --partial-dir=.rsync-partial \
              out/zsync/ "${REMOTE}/zsync/"

      - name: Create GitHub release
        if: env.DEBUG_BUILD != 'true'
        run: |
          VERSION_TAG="${{ steps.compress.outputs.version_tag }}"
          RELEASE_NAME="${{ steps.compress.outputs.release_name }}"
          echo "" >> out/CHANGELOG.md
          echo "Download mirror: https://build.chrisaw.io/${RELEASE_NAME}/" >> out/CHANGELOG.md
          cd out/
          gh release create \
            --notes-file CHANGELOG.md \
            --title "RestlessOS ${VERSION_TAG}" \
            "${VERSION_TAG}" \
            ./*.img.xz

      - name: Flush and unmount data volume
        run: |
          sync
          # lazy unmount: the self-hosted runner may still hold the mount
          # namespace open (cwd, file descriptors, repo locks) even though no
          # further writes are happening. a lazy detach is safe because we have
          # already synced and the teardown job will detach the volume.
          if ! sudo umount -l ${{ env.EC2_DATA_VOLUME_MOUNT }}; then
            echo "WARN: lazy umount failed, dumping holders for diagnostics"
            sudo lsof +D ${{ env.EC2_DATA_VOLUME_MOUNT }} 2>/dev/null || true
            sudo fuser -v ${{ env.EC2_DATA_VOLUME_MOUNT }} 2>/dev/null || true
            exit 1
          fi
          echo "Data volume flushed and unmounted -- ready for teardown"

  # ---------------------------------------------------------------------------
  # job 7: teardown
  # always runs - terminates all EC2 instances, deletes the data volume, and
  # removes all runners. the cloud-init shutdown timer is the backup.
  # ---------------------------------------------------------------------------
  teardown:
    name: Teardown
    needs: [provision-sync, sync, provision-build, build, provision-sign, sign]
    runs-on: ubuntu-latest
    if: always()
    outputs:
      spot_interrupted: ${{ steps.check_spot.outputs.spot_interrupted }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.provision-sync.outputs.region || env.EC2_DEFAULT_REGION }}
        env:
          EC2_DEFAULT_REGION: ${{ env.EC2_DEFAULT_REGION }}

      - name: Check for spot interruption
        id: check_spot
        run: |
          echo "spot_interrupted=false" >> "$GITHUB_OUTPUT"

          SYNC_INSTANCE="${{ needs.provision-sync.outputs.instance_id }}"
          BUILD_INSTANCE="${{ needs.provision-build.outputs.instance_id }}"
          SYNC_RESULT="${{ needs.sync.result }}"
          BUILD_RESULT="${{ needs.build.result }}"

          check_instance() {
            local INSTANCE_ID="$1"
            local REGION="$2"
            local LABEL="$3"

            if [ -z "${INSTANCE_ID}" ]; then
              return 1
            fi

            for i in $(seq 1 12); do
              STATE=$(aws ec2 describe-instances \
                --region "${REGION}" \
                --instance-ids "${INSTANCE_ID}" \
                --query 'Reservations[0].Instances[0].State.Name' \
                --output text 2>/dev/null || echo "unknown")

              REASON=$(aws ec2 describe-instances \
                --region "${REGION}" \
                --instance-ids "${INSTANCE_ID}" \
                --query 'Reservations[0].Instances[0].StateReason.Code' \
                --output text 2>/dev/null || echo "unknown")

              echo "  ${LABEL} poll ${i}/12: state=${STATE} reason=${REASON}"

              if [ "${REASON}" = "Server.SpotInstanceTermination" ]; then
                echo "::warning::Spot instance ${LABEL} was reclaimed by AWS"
                return 0
              elif [ "${STATE}" = "terminated" ] || [ "${STATE}" = "shutting-down" ]; then
                echo "::warning::${LABEL} instance was terminated externally (probable spot reclamation)"
                return 0
              fi

              sleep 10
            done

            return 1
          }

          REGION="${{ needs.provision-sync.outputs.region || env.EC2_DEFAULT_REGION }}"

          # check sync instance if sync job failed/cancelled
          if [ "${SYNC_RESULT}" = "failure" ] || [ "${SYNC_RESULT}" = "cancelled" ]; then
            if check_instance "${SYNC_INSTANCE}" "${REGION}" "sync"; then
              echo "spot_interrupted=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          # check build instance if build job failed/cancelled
          if [ "${BUILD_RESULT}" = "failure" ] || [ "${BUILD_RESULT}" = "cancelled" ]; then
            if check_instance "${BUILD_INSTANCE}" "${REGION}" "build"; then
              echo "spot_interrupted=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Terminate instances
        run: |
          for ENTRY in \
            "sync:${{ needs.provision-sync.outputs.instance_id }}:${{ needs.provision-sync.outputs.region || env.EC2_DEFAULT_REGION }}" \
            "build:${{ needs.provision-build.outputs.instance_id }}:${{ needs.provision-build.outputs.region || needs.provision-sync.outputs.region || env.EC2_DEFAULT_REGION }}" \
            "sign:${{ needs.provision-sign.outputs.instance_id }}:${{ needs.provision-sign.outputs.region || needs.provision-sync.outputs.region || env.EC2_DEFAULT_REGION }}"; do
            NAME="${ENTRY%%:*}"
            REST="${ENTRY#*:}"
            INSTANCE_ID="${REST%:*}"
            REGION="${REST#*:}"

            if [ -z "${INSTANCE_ID}" ] || [ "${INSTANCE_ID}" = "" ]; then
              echo "No ${NAME} instance ID - skipping"
              continue
            fi

            echo "Terminating ${NAME} instance ${INSTANCE_ID} in ${REGION}..."
            aws ec2 terminate-instances \
              --region "${REGION}" \
              --instance-ids "${INSTANCE_ID}" || true
          done
          echo "All terminate requests sent"

      - name: Wait for instances to terminate
        run: |
          REGION="${{ needs.provision-sync.outputs.region || env.EC2_DEFAULT_REGION }}"
          SYNC_INSTANCE="${{ needs.provision-sync.outputs.instance_id }}"
          BUILD_INSTANCE="${{ needs.provision-build.outputs.instance_id }}"
          SIGN_INSTANCE="${{ needs.provision-sign.outputs.instance_id }}"

          for INSTANCE_ID in "${SYNC_INSTANCE}" "${BUILD_INSTANCE}" "${SIGN_INSTANCE}"; do
            if [ -z "${INSTANCE_ID}" ] || [ "${INSTANCE_ID}" = "" ]; then
              continue
            fi

            echo "Waiting for instance ${INSTANCE_ID} to terminate..."
            aws ec2 wait instance-terminated \
              --region "${REGION}" \
              --instance-ids "${INSTANCE_ID}" \
              || echo "WARNING: wait timed out for ${INSTANCE_ID}"

            STATE=$(aws ec2 describe-instances \
              --region "${REGION}" \
              --instance-ids "${INSTANCE_ID}" \
              --query 'Reservations[0].Instances[0].State.Name' \
              --output text 2>/dev/null || echo "unknown")

            if [ "$STATE" = "terminated" ] || [ "$STATE" = "shutting-down" ]; then
              echo "Confirmed: instance ${INSTANCE_ID} is ${STATE}"
            else
              echo "::warning::Instance ${INSTANCE_ID} is in state '${STATE}' - may still be running"
            fi
          done

      - name: Delete data volume
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 60
          retry_wait_seconds: 10
          command: |
            DATA_VOLUME_ID="${{ needs.provision-sync.outputs.data_volume_id }}"
            if [ -z "${DATA_VOLUME_ID}" ] || [ "${DATA_VOLUME_ID}" = "" ]; then
              echo "No data volume ID found - nothing to delete"
              exit 0
            fi

            REGION="${{ needs.provision-sync.outputs.region || env.EC2_DEFAULT_REGION }}"

            echo "Deleting volume ${DATA_VOLUME_ID}..."
            aws ec2 delete-volume \
              --region "${REGION}" \
              --volume-id "${DATA_VOLUME_ID}" || true

            STATE=$(aws ec2 describe-volumes \
              --region "${REGION}" \
              --volume-ids "${DATA_VOLUME_ID}" \
              --query 'Volumes[0].State' --output text 2>/dev/null || echo "deleted")

            if [ "${STATE}" != "deleted" ] && [ -n "${STATE}" ]; then
              echo "Volume ${DATA_VOLUME_ID} still in state '${STATE}'"
              exit 1
            fi

            echo "Volume ${DATA_VOLUME_ID} deleted"

      - name: Remove runners
        run: |
          for RUNNER_LABEL in \
            "${{ needs.provision-sync.outputs.runner_label }}" \
            "${{ needs.provision-build.outputs.runner_label }}" \
            "${{ needs.provision-sign.outputs.runner_label }}"; do
            if [ -z "${RUNNER_LABEL}" ] || [ "${RUNNER_LABEL}" = "" ]; then
              continue
            fi

            RUNNER_ID=$(curl --fail --silent \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runners" \
              | jq --arg label "${RUNNER_LABEL}" --raw-output \
                '.runners[] | select(.labels[].name == $label) | .id' \
              | head --lines=1)

            if [ -n "${RUNNER_ID}" ] && [ "${RUNNER_ID}" != "null" ]; then
              curl --fail --request DELETE --silent \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${{ secrets.GH_PAT }}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runners/${RUNNER_ID}"
              echo "Removed runner ${RUNNER_ID} (label: ${RUNNER_LABEL})"
            else
              echo "Runner '${RUNNER_LABEL}' already removed (ephemeral runners deregister on exit)"
            fi
          done

      - name: Build summary
        if: always()
        run: |
          BUILD_RESULT="${{ needs.build.result }}"
          SPOT_HIT="${{ steps.check_spot.outputs.spot_interrupted }}"
          ATTEMPT="${{ github.event.inputs._retry_attempt || '0' }}"
          {
            echo "## Build Summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Build result | ${BUILD_RESULT} |"
            echo "| Spot interrupted | ${SPOT_HIT} |"
            echo "| Attempt | $((ATTEMPT + 1)) of ${{ env.SPOT_RETRY_MAX_ATTEMPTS }} |"
            echo "| Sync instance | ${{ needs.provision-sync.outputs.instance_id }} (${{ env.EC2_SYNC_INSTANCE_TYPE }}) |"
            echo "| Build instance | ${{ needs.provision-build.outputs.instance_id }} (${{ env.EC2_BUILD_INSTANCE_TYPE }}, 192 vCPUs) |"
            echo "| Sign instance | ${{ needs.provision-sign.outputs.instance_id }} (${{ env.EC2_SIGN_INSTANCE_TYPE }}) |"
            echo "| Region | ${{ needs.provision-sync.outputs.region || 'N/A' }} |"
            echo "| Data volume | ${{ needs.provision-sync.outputs.data_volume_id || 'N/A' }} |"
            echo "| Sync runner | ${{ needs.provision-sync.outputs.runner_label }} |"
            echo "| Build runner | ${{ needs.provision-build.outputs.runner_label }} |"
            echo "| Sign runner | ${{ needs.provision-sign.outputs.runner_label }} |"
            echo "| Instances terminated | yes |"
            echo "| Data volume deleted | yes |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # job 8: retry on spot interruption
  # if either instance was reclaimed by AWS, re-trigger the workflow
  # automatically (up to SPOT_RETRY_MAX_ATTEMPTS attempts).
  # ---------------------------------------------------------------------------
  retry:
    name: Retry on Spot Interruption
    needs: [ teardown ]
    runs-on: ubuntu-latest
    if: always() && needs.teardown.outputs.spot_interrupted == 'true'

    steps:
      - name: Check retry budget
        id: budget
        run: |
          MAX_ATTEMPTS=${{ env.SPOT_RETRY_MAX_ATTEMPTS }}
          ATTEMPT=${{ github.event.inputs._retry_attempt || '0' }}
          NEXT=$((ATTEMPT + 1))
          echo "Current attempt: $((ATTEMPT + 1)), next would be: $((NEXT + 1))"
          if [ "$((NEXT >= MAX_ATTEMPTS))" -eq 1 ]; then
            echo "::error::Spot retry budget exhausted (${{ env.SPOT_RETRY_MAX_ATTEMPTS }} attempts). Giving up."
            echo "has_budget=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_budget=true" >> "$GITHUB_OUTPUT"
            echo "next_attempt=${NEXT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-trigger workflow
        if: steps.budget.outputs.has_budget == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEXT="${{ steps.budget.outputs.next_attempt }}"
          echo "::warning::Spot instance was reclaimed — retrying (attempt $((NEXT + 1)) of ${{ env.SPOT_RETRY_MAX_ATTEMPTS }})..."
          gh workflow run build.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref }}" \
            --field release_channel="${{ github.event.inputs.release_channel || 'stable' }}" \
            --field debug_build="${{ github.event.inputs.debug_build || 'false' }}" \
            --field _retry_attempt="${NEXT}"