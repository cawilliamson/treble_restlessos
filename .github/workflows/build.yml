name: Build GrapheneOS GSI

on:
  workflow_dispatch:
    inputs:
      grapheneos_tag:
        description: 'grapheneos tag to build (blank = auto-detect latest stable)'
        required: false
        default: ''
      grapheneos_branch:
        description: 'grapheneos branch to build from HEAD (ignored if tag is set)'
        required: false
        default: ''
      release_channel:
        description: 'release channel for auto-detection (stable/beta/alpha)'
        required: false
        default: 'stable'
      debug_build:
        description: 'enable debug patches (verbose logging, open logcat) -- do not ship'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

# only one build at a time - spot instances are expensive
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # job 1: provision
  # runs on a free github-hosted runner. launches an EC2 spot instance,
  # registers it as an ephemeral self-hosted runner, and waits for it to
  # come online.
  # ---------------------------------------------------------------------------
  provision:
    name: Provision EC2 Spot Instance
    runs-on: ubuntu-latest
    outputs:
      instance_id: ${{ steps.launch.outputs.instance_id }}
      runner_label: ${{ steps.runner_label.outputs.label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Generate unique runner label
        id: runner_label
        run: |
          LABEL="gsi-build-${{ github.run_id }}"
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"
          echo "Runner label: ${LABEL}"

      - name: Get GitHub Actions runner registration token
        id: runner_token
        run: |
          RESPONSE=$(curl --fail --request POST --silent \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token")
          TOKEN=$(echo "$RESPONSE" | jq --raw-output '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: failed to get runner registration token"
            echo "$RESPONSE" | jq .
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Render cloud-init user-data
        run: |
          SSH_KEY_B64=$(echo "${{ secrets.BUILD_SSH_KEY }}" | base64 --wrap=0)
          REPO_URL="https://github.com/${{ github.repository }}"
          RUNNER_LABEL="${{ steps.runner_label.outputs.label }}"
          RUNNER_TOKEN="${{ steps.runner_token.outputs.token }}"

          sed \
            --expression "s|__REPO_URL__|${REPO_URL}|g" \
            --expression "s|__RUNNER_LABELS__|${RUNNER_LABEL}|g" \
            --expression "s|__RUNNER_TOKEN__|${RUNNER_TOKEN}|g" \
            --expression "s|__SSH_KEY_B64__|${SSH_KEY_B64}|g" \
            .github/cloud-init/user-data.yml \
            > /tmp/user-data.yml

          echo "user-data rendered: $(wc --bytes < /tmp/user-data.yml) bytes"

      - name: Find latest Ubuntu 24.04 AMI
        id: ami
        run: |
          AMI_ID=$(aws ec2 describe-images \
            --filters \
              "Name=name,Values=ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-amd64-server-*" \
              "Name=state,Values=available" \
            --output text \
            --owners 099720109477 \
            --query 'Images | sort_by(@, &CreationDate) | [-1].ImageId')
          echo "ami_id=${AMI_ID}" >> "$GITHUB_OUTPUT"
          echo "Using AMI: ${AMI_ID}"

      - name: Find latest build snapshot
        id: snapshot
        run: |
          SNAP_ID=$(aws ec2 describe-snapshots \
            --owner-ids self \
            --filters "Name=tag:Project,Values=treble-grapheneos" \
            --query 'Snapshots | sort_by(@, &StartTime) | [-1].SnapshotId' \
            --output text 2>/dev/null || echo "None")
          if [ "$SNAP_ID" != "None" ] && [ -n "$SNAP_ID" ]; then
            echo "Found snapshot: ${SNAP_ID}"
            echo "snapshot_id=${SNAP_ID}" >> "$GITHUB_OUTPUT"
          else
            echo "No snapshot found — will use empty volume"
            echo "snapshot_id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Launch EC2 spot instance
        id: launch
        run: |
          # c7i.48xlarge: 192 vCPUs, 384 GiB RAM
          # InstanceInitiatedShutdownBehavior=terminate ensures the cloud-init
          # safety timer (shutdown -P +120) destroys the instance entirely.
          # if a build snapshot exists, use it as the root volume to get
          # cached src/, out/, and pre-installed packages.
          SNAP_ID="${{ steps.snapshot.outputs.snapshot_id }}"
          if [ -n "$SNAP_ID" ]; then
            echo "Using snapshot ${SNAP_ID} for root volume"
            BDM="[{\"DeviceName\":\"/dev/sda1\",\"Ebs\":{\"SnapshotId\":\"${SNAP_ID}\",\"VolumeSize\":500,\"VolumeType\":\"gp3\",\"Iops\":16000,\"Throughput\":1000,\"DeleteOnTermination\":true}}]"
          else
            echo "No snapshot — starting with empty volume"
            BDM='[{"DeviceName":"/dev/sda1","Ebs":{"VolumeSize":500,"VolumeType":"gp3","Iops":16000,"Throughput":1000,"DeleteOnTermination":true}}]'
          fi
          # try each subnet (AZ) until one has capacity.
          IFS=',' read -ra SUBNETS <<< "${{ secrets.AWS_SUBNET_IDS }}"
          INSTANCE_ID=""
          for SUBNET in "${SUBNETS[@]}"; do
            echo "Trying subnet ${SUBNET}..."
            INSTANCE_ID=$(aws ec2 run-instances \
              --block-device-mappings "${BDM}" \
              --image-id "${{ steps.ami.outputs.ami_id }}" \
              --instance-initiated-shutdown-behavior terminate \
              --instance-market-options '{"MarketType":"spot","SpotOptions":{"SpotInstanceType":"one-time","InstanceInterruptionBehavior":"terminate"}}' \
              --instance-type c7i.48xlarge \
              --output text \
              --query 'Instances[0].InstanceId' \
              --security-group-ids "${{ secrets.AWS_SECURITY_GROUP_ID }}" \
              --subnet-id "${SUBNET}" \
              --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=gsi-build-${{ github.run_id }}},{Key=Project,Value=treble-grapheneos},{Key=Ephemeral,Value=true}]" \
              --user-data "file:///tmp/user-data.yml" 2>&1) && break
            echo "  failed: ${INSTANCE_ID}"
            INSTANCE_ID=""
          done

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "ERROR: failed to launch spot instance in any AZ"
            exit 1
          fi

          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          echo "Launched spot instance: ${INSTANCE_ID} (c7i.48xlarge in eu-west-2)"

      - name: Wait for instance to reach running state
        run: |
          echo "Waiting for instance ${{ steps.launch.outputs.instance_id }} to start..."
          aws ec2 wait instance-running \
            --instance-ids "${{ steps.launch.outputs.instance_id }}"
          echo "Instance is running"

      - name: Wait for runner to register with GitHub Actions
        run: |
          LABEL="${{ steps.runner_label.outputs.label }}"
          echo "Waiting for runner with label '${LABEL}' to register..."

          for i in $(seq 1 60); do
            ONLINE=$(curl --fail --silent \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runners" \
              | jq --arg label "$LABEL" --raw-output \
                '[.runners[] | select(.labels[].name == $label) | select(.status == "online")] | length')

            echo "  attempt ${i}/60: ${ONLINE} runner(s) online with label '${LABEL}'"

            if [ "${ONLINE}" -ge 1 ] 2>/dev/null; then
              echo "Runner is online and ready"
              exit 0
            fi
            sleep 15
          done

          echo "ERROR: runner never came online after 15 minutes"
          exit 1

  # ---------------------------------------------------------------------------
  # job 2: build
  # runs DIRECTLY ON the EC2 spot instance via the ephemeral self-hosted
  # runner. all steps execute on the 192-vCPU machine.
  # ---------------------------------------------------------------------------
  build:
    name: Build ROM
    needs: provision
    runs-on: [ self-hosted, "${{ needs.provision.outputs.runner_label }}" ]
    timeout-minutes: 120

    env:
      GH_TOKEN: ${{ github.token }}
      DEBUG_BUILD: ${{ github.event.inputs.debug_build || 'false' }}
      GRAPHENEOS_TAG: ${{ github.event.inputs.grapheneos_tag }}
      GRAPHENEOS_BRANCH: ${{ github.event.inputs.grapheneos_branch }}
      GRAPHENEOS_RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || 'stable' }}
      WEB_DIR: /var/www/build.chrisaw.io
      REPO_PATH: ${{ github.repository }}

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v6

      - name: Verify gh CLI authentication
        run: gh auth status

      - name: Resolve GrapheneOS tag
        run: |
          mkdir --parents tmp/ out/ src/
          BUILD_DATETIME=$(date "+%s")
          BUILD_NUMBER=$(date "+%Y%m%d%H%M")
          echo "${BUILD_DATETIME}" > tmp/.build_datetime
          echo "${BUILD_NUMBER}" > tmp/.build_number

          if [ -n "${GRAPHENEOS_TAG}" ]; then
            echo "Using manually specified tag: ${GRAPHENEOS_TAG}"
            echo "${GRAPHENEOS_TAG}" > tmp/.grapheneos_tag

          elif [ -n "${GRAPHENEOS_BRANCH}" ]; then
            echo "WARNING: building from branch '${GRAPHENEOS_BRANCH}' (HEAD) - not a stable release!"
            echo "${GRAPHENEOS_BRANCH}" > tmp/.grapheneos_branch

          else
            echo "Fetching latest ${GRAPHENEOS_RELEASE_CHANNEL} tag from grapheneos.org/releases..."
            RELEASES_HTML=$(curl --fail --silent "https://grapheneos.org/releases")
            TAG=$(echo "${RELEASES_HTML}" \
              | grep --only-matching --perl-regexp "id=[a-z]+-${GRAPHENEOS_RELEASE_CHANNEL}><td>[^<]+</td><td><a href=#\K[0-9]{10}" \
              | sort --numeric-sort --reverse | head --lines=1)
            if [ -z "${TAG}" ]; then
              echo "ERROR: failed to extract a valid ${GRAPHENEOS_RELEASE_CHANNEL} tag"
              exit 1
            fi
            echo "Resolved latest ${GRAPHENEOS_RELEASE_CHANNEL} tag: ${TAG}"
            echo "${TAG}" > tmp/.grapheneos_tag
          fi

      - name: Clean stale build artifacts
        run: |
          # remove stale locks, product output, and aapt2 intermediates that
          # break incremental builds when running from a snapshot.
          rm -rfv src/out/.lock src/out/target/product/tdgsi_arm64_ab/ 2>/dev/null || true
          find src/out/soong/.intermediates/prebuilts/sdk/ -type d \
            \( -name aapt2 -o -name flat-res \) -exec rm -rfv {} + 2>/dev/null || true
          rm -fv tmp/*.img* out/*.img* 2>/dev/null || true
          rm -rfv out/zsync/ 2>/dev/null || true

      - name: Sync GrapheneOS sources
        working-directory: src/
        run: |
          GRAPHENEOS_TAG=$(cat ../tmp/.grapheneos_tag 2>/dev/null || true)
          GRAPHENEOS_BRANCH=$(cat ../tmp/.grapheneos_branch 2>/dev/null || true)
          if [ -n "${GRAPHENEOS_TAG}" ]; then
            echo "Initialising from tag: ${GRAPHENEOS_TAG}"
            repo init --depth=1 --git-lfs \
              --manifest-branch "refs/tags/${GRAPHENEOS_TAG}" \
              --manifest-url https://github.com/GrapheneOS/platform_manifest.git
          elif [ -n "${GRAPHENEOS_BRANCH}" ]; then
            echo "Initialising from branch: ${GRAPHENEOS_BRANCH}"
            repo init --depth=1 --git-lfs \
              --manifest-branch "${GRAPHENEOS_BRANCH}" \
              --manifest-url https://github.com/GrapheneOS/platform_manifest.git
          else
            echo "ERROR: no tag or branch resolved"
            exit 1
          fi
          mkdir --parents .repo/local_manifests
          cp --verbose ../configs/manifests/*.xml .repo/local_manifests/
          SYNC_JOBS=$(( $(nproc --all) > 100 ? 100 : $(nproc --all) ))
          while ! repo sync --force-sync --jobs=${SYNC_JOBS} --no-clone-bundle --no-tags; do
            echo "repo sync failed, retrying in 30s..."
            sleep 30
          done
          AOSP_TAG=$(grep --max-count=1 "aosp_revision:" .repo/manifests/config.yml | sed "s/.*: *//")
          ANDROID_VERSION=$(echo "${AOSP_TAG}" | sed "s/android-//;s/_r.*//")
          echo "Detected ANDROID_VERSION: ${ANDROID_VERSION}"
          echo "${ANDROID_VERSION}" > ../tmp/.android_version
          ANDROID_VERSION_TAG=$(grep --max-count=1 "target:" build/release/release_config_map.textproto \
            | sed "s/.*\"\([^\"]*\)\".*/\1/")
          echo "Detected ANDROID_VERSION_TAG: ${ANDROID_VERSION_TAG}"
          echo "${ANDROID_VERSION_TAG}" > ../tmp/.android_version_tag

      - name: Reset repos to upstream
        working-directory: src/
        run: |
          # strip any patches left over from a previous build (snapshot).
          # each repo is a shallow clone — the root commit is the upstream
          # manifest revision.
          if [ -d .repo ]; then
            echo "Resetting all repos to upstream..."
            # shellcheck disable=SC2016 # single quotes are intentional;
            # the expansion must happen inside the repo forall subshell
            repo forall -c 'git reset --hard $(git rev-list --max-parents=0 HEAD | tail -1)' 2>/dev/null || true
          fi

      - name: Apply patches
        working-directory: src/
        run: |
          cp --recursive --verbose ../patches .
          patches/apply.sh . trebledroid
          patches/apply.sh . trebledroid-staging
          patches/apply.sh . legacy-devices
          patches/apply.sh . grapheneos
          patches/apply.sh . personal
          if [ "${DEBUG_BUILD}" = "true" ]; then
            echo "*** DEBUG BUILD: applying debug patches ***"
            patches/apply.sh . debug
          fi

      - name: Build TrebleApp
        working-directory: src/treble_app
        run: bash build.sh release

      - name: Build ROM image
        working-directory: src/
        run: |
          ANDROID_VERSION_TAG_VAL=$(cat ../tmp/.android_version_tag)
          pushd device/phh/treble
            cp --force --verbose ../../../../configs/rom/grapheneos.mk .
            bash generate.sh grapheneos
          popd
          . build/envsetup.sh
          lunch "treble_arm64_bvN-${ANDROID_VERSION_TAG_VAL}-userdebug"
          make systemimage -j"$(nproc --all)"
          make target-files-package otatools -j"$(nproc --all)"

      - name: Sign ROM image
        working-directory: src/
        run: |
          ANDROID_VERSION_TAG_VAL=$(cat ../tmp/.android_version_tag)
          . build/envsetup.sh
          lunch "treble_arm64_bvN-${ANDROID_VERSION_TAG_VAL}-userdebug"
          bash vendor/cawilliamson-priv/keys/sign.sh
          rm --force --verbose "${OUT}/system.img"
          unzip -joq "${OUT}/signed-target_files.zip" IMAGES/system.img -d "${OUT}/"
          rm --force --verbose "${OUT}/signed-target_files.zip"
          mv --verbose "${OUT}/system.img" ../tmp/system.img

      - name: Compress ROM image
        id: compress
        run: |
          ANDROID_VERSION=$(cat tmp/.android_version)
          BUILD_NUMBER=$(cat tmp/.build_number)
          VERSION_TAG="${ANDROID_VERSION}-${BUILD_NUMBER}"
          if [ "${DEBUG_BUILD}" = "true" ]; then
            VERSION_TAG="${VERSION_TAG}-debug"
          fi
          cd tmp/
          img="GrapheneOS-arm64-ab-${VERSION_TAG}.img"
          mv --verbose system.img "${img}"
          mkdir --parents ../out/zsync
          zsyncmake -o "../out/zsync/${img}.zsync" -u "${img}" -v "${img}"
          cp --verbose "${img}" "../out/zsync/${img}"
          xz -9 --compress --memlimit-compress=0 --threads=0 --verbose "${img}"
          cp --force --verbose "${img}.xz" ../out/
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=GrapheneOS-ab-${VERSION_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts to build.chrisaw.io
        run: |
          RELEASE_NAME="${{ steps.compress.outputs.release_name }}"
          rsync --archive --compress --mkpath --verbose \
            out/*.img.xz \
            "build.chrisaw.io:/var/www/build.chrisaw.io/${RELEASE_NAME}/"
          rsync --archive --compress --mkpath --verbose \
            out/zsync/ \
            "build.chrisaw.io:/var/www/build.chrisaw.io/${RELEASE_NAME}/zsync/"

      - name: Create GitHub release
        if: env.DEBUG_BUILD != 'true'
        run: |
          VERSION_TAG="${{ steps.compress.outputs.version_tag }}"
          RELEASE_NAME="${{ steps.compress.outputs.release_name }}"
          RELEASE_DESCRIPTION="Download mirror: https://build.chrisaw.io/${RELEASE_NAME}/"
          cd out/
          gh release create \
            --draft \
            --notes "${RELEASE_DESCRIPTION}" \
            --title "GrapheneOS ${VERSION_TAG}" \
            "${VERSION_TAG}" \
            ./*.img.xz


  # ---------------------------------------------------------------------------
  # job 3: teardown
  # always runs - terminates the EC2 instance and removes the runner.
  # the cloud-init shutdown timer is the backup if this job fails.
  # ---------------------------------------------------------------------------
  teardown:
    name: Terminate EC2 Instance
    needs: [ provision, build ]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Snapshot build volume
        env:
          INSTANCE_ID: ${{ needs.provision.outputs.instance_id }}
        run: |
          if [ -z "${INSTANCE_ID}" ] || [ "${INSTANCE_ID}" = "" ]; then
            echo "No instance to snapshot"
            exit 0
          fi

          # find the root volume
          VOL_ID=$(aws ec2 describe-instances \
            --instance-ids "${INSTANCE_ID}" \
            --query 'Reservations[0].Instances[0].BlockDeviceMappings[0].Ebs.VolumeId' \
            --output text 2>/dev/null || echo "None")

          if [ "$VOL_ID" = "None" ] || [ -z "$VOL_ID" ]; then
            echo "WARNING: could not find volume for instance — skipping snapshot"
            exit 0
          fi

          # delete ALL existing snapshots for this project (keep exactly 0 before creating 1)
          echo "Cleaning old snapshots..."
          OLD_SNAPS=$(aws ec2 describe-snapshots \
            --owner-ids self \
            --filters "Name=tag:Project,Values=treble-grapheneos" \
            --query 'Snapshots[].SnapshotId' \
            --output text 2>/dev/null || true)
          for SNAP in $OLD_SNAPS; do
            echo "  deleting old snapshot: ${SNAP}"
            aws ec2 delete-snapshot --snapshot-id "$SNAP" 2>/dev/null || true
          done

          # create new snapshot
          echo "Creating snapshot of volume ${VOL_ID}..."
          NEW_SNAP=$(aws ec2 create-snapshot \
            --volume-id "$VOL_ID" \
            --description "treble_grapheneos build cache $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag-specifications 'ResourceType=snapshot,Tags=[{Key=Project,Value=treble-grapheneos},{Key=Ephemeral,Value=true}]' \
            --query 'SnapshotId' \
            --output text)
          echo "Created snapshot: ${NEW_SNAP}"
          echo "Snapshot will be available for next build"

      - name: Terminate instance
        env:
          INSTANCE_ID: ${{ needs.provision.outputs.instance_id }}
        run: |
          if [ -z "${INSTANCE_ID}" ] || [ "${INSTANCE_ID}" = "" ]; then
            echo "No instance ID found - nothing to terminate"
            exit 0
          fi

          echo "Terminating instance ${INSTANCE_ID}..."
          aws ec2 terminate-instances --instance-ids "${INSTANCE_ID}"
          echo "Terminate request sent"

      - name: Wait for instance termination
        env:
          INSTANCE_ID: ${{ needs.provision.outputs.instance_id }}
        run: |
          if [ -z "${INSTANCE_ID}" ] || [ "${INSTANCE_ID}" = "" ]; then
            exit 0
          fi

          echo "Waiting for instance ${INSTANCE_ID} to terminate..."
          aws ec2 wait instance-terminated \
            --instance-ids "${INSTANCE_ID}" \
            || echo "WARNING: wait timed out, instance may still be terminating"

          STATE=$(aws ec2 describe-instances \
            --instance-ids "${INSTANCE_ID}" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text 2>/dev/null || echo "unknown")

          if [ "$STATE" = "terminated" ] || [ "$STATE" = "shutting-down" ]; then
            echo "Confirmed: instance ${INSTANCE_ID} is ${STATE}"
          else
            echo "::error::Instance ${INSTANCE_ID} is in state '${STATE}' - may still be running!"
            echo "::error::MANUAL ACTION REQUIRED: https://eu-west-2.console.aws.amazon.com/ec2"
            exit 1
          fi

      - name: Remove ephemeral runner from GitHub
        env:
          RUNNER_LABEL: ${{ needs.provision.outputs.runner_label }}
        run: |
          RUNNER_ID=$(curl --fail --silent \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners" \
            | jq --arg label "${RUNNER_LABEL}" --raw-output \
              '.runners[] | select(.labels[].name == $label) | .id' \
            | head --lines=1)

          if [ -n "$RUNNER_ID" ] && [ "$RUNNER_ID" != "null" ]; then
            curl --fail --request DELETE --silent \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runners/${RUNNER_ID}"
            echo "Removed runner ${RUNNER_ID} from GitHub"
          else
            echo "Runner already removed (ephemeral runners deregister themselves on exit)"
          fi

      - name: Build summary
        if: always()
        run: |
          BUILD_RESULT="${{ needs.build.result }}"
          {
            echo "## Build Summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Build result | ${BUILD_RESULT} |"
            echo "| Instance ID | ${{ needs.provision.outputs.instance_id }} |"
            echo "| Instance type | c7i.48xlarge (192 vCPUs) |"
            echo "| Region | eu-west-2 (London) |"
            echo "| Runner label | ${{ needs.provision.outputs.runner_label }} |"
            echo "| Instance terminated | yes |"
          } >> "$GITHUB_STEP_SUMMARY"
