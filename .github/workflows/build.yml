name: Build RestlessOS GSI

on:
  workflow_dispatch:
    inputs:
      debug_build:
        description: 'enable debug patches (verbose logging, open logcat) -- do not ship'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

env:
  EC2_SMALL_INSTANCE: m7i.xlarge
  EC2_LARGE_INSTANCE: c7i.48xlarge
  EC2_SRC_VOLUME_SIZE: 1000

concurrency:
  group: build
  cancel-in-progress: true

jobs:

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    outputs:
      subnet_id_a: ${{ steps.tofu.outputs.subnet_id_a }}
      subnet_id_b: ${{ steps.tofu.outputs.subnet_id_b }}
      subnet_id_c: ${{ steps.tofu.outputs.subnet_id_c }}
      security_group_id: ${{ steps.tofu.outputs.security_group_id }}
      ami_id: ${{ steps.tofu.outputs.ami_id }}
      target_subnet_id: ${{ steps.select-az.outputs.target_subnet_id }}
      target_az: ${{ steps.select-az.outputs.target_az }}
      sync_label: ${{ steps.sync-label.outputs.label }}
      sync_instance_id: ${{ steps.sync-provision.outputs.instance_id }}
      sync_data_volume_id: ${{ steps.sync-provision.outputs.data_volume_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2
      - id: tofu
        name: Apply infrastructure (OpenTofu)
        uses: dflook/tofu-apply@v2
        with:
          path: .github/terraform
          auto_approve: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: select-az
        name: Select availability zone
        run: |
          result=$(.github/scripts/ec2.sh select-az)
          echo "target_subnet_id=$(echo "$result" | jq -r .subnet)" >> "$GITHUB_OUTPUT"
          echo "target_az=$(echo "$result" | jq -r .az)" >> "$GITHUB_OUTPUT"
          echo "selected az: $(echo "$result" | jq -r .az)"
        env:
          AWS_REGION: eu-west-2
          EC2_LARGE_INSTANCE: ${{ env.EC2_LARGE_INSTANCE }}
          EC2_SUBNET_ID_A: ${{ steps.tofu.outputs.subnet_id_a }}
          EC2_SUBNET_ID_B: ${{ steps.tofu.outputs.subnet_id_b }}
          EC2_SUBNET_ID_C: ${{ steps.tofu.outputs.subnet_id_c }}
      - id: sync-label
        name: Generate sync runner label
        run: echo "label=gsi-build-sync-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - id: sync-provision
        name: Provision sync instance
        uses: nick-fields/retry@v4
        with:
          max_attempts: 60
          retry_wait_seconds: 60
          timeout_minutes: 1
          command: .github/scripts/ec2.sh provision
        env:
          EC2_INSTANCE_TYPE: ${{ env.EC2_SMALL_INSTANCE }}
          EC2_SUBNET_ID: ${{ steps.select-az.outputs.target_subnet_id }}
          EC2_SG_ID: ${{ steps.tofu.outputs.security_group_id }}
          EC2_AMI_ID: ${{ steps.tofu.outputs.ami_id }}
          GH_PAT: ${{ secrets.GH_PAT }}
          BUILD_SSH_KEY: ${{ secrets.BUILD_SSH_KEY }}
          PACKAGES: "bc curl git git-lfs jq python3 rsync unzip wget xz-utils zip zsync"
          RUNNER_LABEL: ${{ steps.sync-label.outputs.label }}
          EC2_DATA_VOLUME: ${{ env.EC2_SRC_VOLUME_SIZE }}

  sync:
    name: Sync Sources
    needs: deploy-infrastructure
    runs-on: [self-hosted, "${{ needs.deploy-infrastructure.outputs.sync_label }}"]
    timeout-minutes: 180
    outputs:
      grapheneos_tag: ${{ steps.resolve_tag.outputs.tag }}
      android_version: ${{ steps.parse_version.outputs.android_version }}
      android_version_tag: ${{ steps.parse_version.outputs.android_version_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with: { clean: false, lfs: true, fetch-depth: 0, fetch-tags: true }
      - name: Mount sync data volume
        run: .github/scripts/ebs.sh mount
        env:
          VOLUME_ID: ${{ needs.deploy-infrastructure.outputs.sync_data_volume_id }}
      - id: resolve_tag
        name: Resolve latest GrapheneOS tag
        working-directory: /mnt/src/
        run: |
          TAG=$(curl -fsS "https://grapheneos.org/releases" \
            | grep -oP "id=[a-z]+-stable><td>[^<]+</td><td><a href=#\K[0-9]{10}" \
            | sort -nr | head -1)
          [ -z "$TAG" ] && { echo "ERROR: failed to resolve tag"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Initialise repo manifest
        working-directory: /mnt/src/
        run: |
          repo init --depth=1 --git-lfs \
            --manifest-branch "refs/tags/${{ steps.resolve_tag.outputs.tag }}" \
            --manifest-url https://github.com/GrapheneOS/platform_manifest.git
          mkdir -p .repo/local_manifests
          cp -v ${{ github.workspace }}/configs/manifests/*.xml .repo/local_manifests/
      - name: Sync AOSP sources
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 120
          max_attempts: 20
          retry_wait_seconds: 30
          command: |
            cd /mnt/src
            repo sync --force-sync --jobs=4 --no-clone-bundle --no-tags
      - id: parse_version
        name: Parse Android version
        working-directory: /mnt/src/
        run: |
          AOSP_TAG=$(grep -m1 "aosp_revision:" .repo/manifests/config.yml | sed "s/.*: *//")
          ANDROID_VERSION=$(echo "${AOSP_TAG}" | sed "s/android-//;s/_r.*//")
          ANDROID_VERSION_TAG=$(grep -m1 "target:" build/release/release_config_map.textproto | sed 's/.*"\([^"]*\)".*/\1/')
          echo "android_version=${ANDROID_VERSION}" >> "$GITHUB_OUTPUT"
          echo "android_version_tag=${ANDROID_VERSION_TAG}" >> "$GITHUB_OUTPUT"
      - name: Apply patches
        working-directory: /mnt/src/
        run: |
          for tier in trebledroid trebledroid-staging rom personal; do
            ${{ github.workspace }}/patches/apply.sh . "${tier}"
          done
          if [ "${{ github.event.inputs.debug_build || 'false' }}" = "true" ]; then
            ${{ github.workspace }}/patches/apply.sh . debug-builds
          else
            ${{ github.workspace }}/patches/apply.sh . release-builds
          fi
      - name: Unmount sync data volume
        run: .github/scripts/ebs.sh umount

  # -------------------------------------------------------------------------
  # build instance: stop sync then start build
  # -------------------------------------------------------------------------
  start-build:
    name: Swap to Build Instance
    needs: [deploy-infrastructure, sync]
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.label.outputs.label }}
      instance_id: ${{ steps.provision.outputs.instance_id }}
      data_volume_id: ${{ needs.deploy-infrastructure.outputs.sync_data_volume_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2
      - name: Detach data volume
        run: .github/scripts/ebs.sh detach
        env:
          VOLUME_ID: ${{ needs.deploy-infrastructure.outputs.sync_data_volume_id }}
      - name: Terminate sync instance
        run: .github/scripts/ec2.sh kill
        env:
          EC2_INSTANCE_ID: ${{ needs.deploy-infrastructure.outputs.sync_instance_id }}
          GH_PAT: ${{ secrets.GH_PAT }}
          RUNNER_LABEL: ${{ needs.deploy-infrastructure.outputs.sync_label }}
      - id: label
        name: Generate build runner label
        run: echo "label=gsi-build-build-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - id: provision
        name: Provision build instance
        uses: nick-fields/retry@v4
        with:
          max_attempts: 60
          retry_wait_seconds: 60
          timeout_minutes: 1
          command: .github/scripts/ec2.sh provision
        env:
          EC2_INSTANCE_TYPE: ${{ env.EC2_LARGE_INSTANCE }}
          EC2_SUBNET_ID: ${{ needs.deploy-infrastructure.outputs.target_subnet_id }}
          EC2_SG_ID: ${{ needs.deploy-infrastructure.outputs.security_group_id }}
          EC2_AMI_ID: ${{ needs.deploy-infrastructure.outputs.ami_id }}
          GH_PAT: ${{ secrets.GH_PAT }}
          BUILD_SSH_KEY: ${{ secrets.BUILD_SSH_KEY }}
          PACKAGES: "bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick jq lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils lzop openjdk-11-jdk pngcrush python3 rsync schedtool squashfs-tools unzip wget xsltproc xz-utils zip zlib1g-dev zsync"
          RUNNER_LABEL: ${{ steps.label.outputs.label }}
          EC2_MARKET_TYPE: spot
          EC2_ROOT_VOLUME: "100"
      - name: Attach data volume
        run: .github/scripts/ebs.sh attach
        env:
          VOLUME_ID: ${{ needs.deploy-infrastructure.outputs.sync_data_volume_id }}
          EC2_INSTANCE_ID: ${{ steps.provision.outputs.instance_id }}

  build:
    name: Build ROM
    needs: [start-build, sync]
    runs-on: [self-hosted, "${{ needs.start-build.outputs.label }}"]
    timeout-minutes: 120
    outputs:
      android_version: ${{ needs.sync.outputs.android_version }}
      android_version_tag: ${{ needs.sync.outputs.android_version_tag }}
      build_datetime: ${{ steps.metadata.outputs.build_datetime }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      grapheneos_tag: ${{ needs.sync.outputs.grapheneos_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with: { clean: false, lfs: true, fetch-depth: 0, fetch-tags: true }
      - name: Mount data volume
        run: .github/scripts/ebs.sh mount
        env:
          VOLUME_ID: ${{ needs.start-build.outputs.data_volume_id }}
      - id: metadata
        name: Capture build metadata
        run: |
          {
            echo "build_datetime=$(date +%s)"
            echo "build_number=$(date +%Y%m%d%H%M)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "GRAPHENEOS_TAG=${{ needs.sync.outputs.grapheneos_tag }}"
            echo "ANDROID_VERSION=${{ needs.sync.outputs.android_version }}"
            echo "ANDROID_VERSION_TAG=${{ needs.sync.outputs.android_version_tag }}"
          } >> "$GITHUB_ENV"
      - name: Build treble_app
        working-directory: /mnt/src/treble_app
        run: bash build.sh release
      - name: Build system image and target files
        working-directory: /mnt/src/
        run: |
          pushd device/phh/treble
            cp -fv ${{ github.workspace }}/configs/rom/rom.mk .
            bash generate.sh rom
          popd
          . build/envsetup.sh
          V="user"; [ "${{ github.event.inputs.debug_build || 'false' }}" = "true" ] && V="userdebug"
          lunch "treble_arm64_bvN-${ANDROID_VERSION_TAG}-${V}"
          make systemimage -j"$(nproc --all)"
          make target-files-package otatools -j"$(nproc --all)"
      - name: Unmount data volume
        run: .github/scripts/ebs.sh umount

  # -------------------------------------------------------------------------
  # sign instance: stop build then start sign
  # -------------------------------------------------------------------------
  start-sign:
    name: Swap to Sign Instance
    needs: [deploy-infrastructure, start-build, build]
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.label.outputs.label }}
      instance_id: ${{ steps.provision.outputs.instance_id }}
      data_volume_id: ${{ needs.start-build.outputs.data_volume_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2
      - name: Detach data volume
        run: .github/scripts/ebs.sh detach
        env:
          VOLUME_ID: ${{ needs.start-build.outputs.data_volume_id }}
      - name: Terminate build instance
        run: .github/scripts/ec2.sh kill
        env:
          EC2_INSTANCE_ID: ${{ needs.start-build.outputs.instance_id }}
          GH_PAT: ${{ secrets.GH_PAT }}
          RUNNER_LABEL: ${{ needs.start-build.outputs.label }}
      - id: label
        name: Generate sign runner label
        run: echo "label=gsi-build-sign-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - id: provision
        name: Provision sign instance
        uses: nick-fields/retry@v4
        with:
          max_attempts: 60
          retry_wait_seconds: 60
          timeout_minutes: 1
          command: .github/scripts/ec2.sh provision
        env:
          EC2_INSTANCE_TYPE: ${{ env.EC2_SMALL_INSTANCE }}
          EC2_SUBNET_ID: ${{ needs.deploy-infrastructure.outputs.target_subnet_id }}
          EC2_SG_ID: ${{ needs.deploy-infrastructure.outputs.security_group_id }}
          EC2_AMI_ID: ${{ needs.deploy-infrastructure.outputs.ami_id }}
          GH_PAT: ${{ secrets.GH_PAT }}
          BUILD_SSH_KEY: ${{ secrets.BUILD_SSH_KEY }}
          PACKAGES: "bc curl git git-lfs gh jq python3 rsync unzip wget xz-utils zip zsync"
          RUNNER_LABEL: ${{ steps.label.outputs.label }}
      - name: Attach data volume
        run: .github/scripts/ebs.sh attach
        env:
          VOLUME_ID: ${{ needs.start-build.outputs.data_volume_id }}
          EC2_INSTANCE_ID: ${{ steps.provision.outputs.instance_id }}

  sign:
    name: Sign and Release
    needs: [start-sign, build]
    runs-on: [self-hosted, "${{ needs.start-sign.outputs.label }}"]
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with: { clean: false, lfs: true, fetch-depth: 0, fetch-tags: true }
      - name: Mount data volume
        run: .github/scripts/ebs.sh mount
        env:
          VOLUME_ID: ${{ needs.start-sign.outputs.data_volume_id }}
      - name: Set build environment variables
        run: |
          {
            echo "BUILD_DATETIME=${{ needs.build.outputs.build_datetime }}"
            echo "BUILD_NUMBER=${{ needs.build.outputs.build_number }}"
            echo "GRAPHENEOS_TAG=${{ needs.build.outputs.grapheneos_tag }}"
            echo "ANDROID_VERSION=${{ needs.build.outputs.android_version }}"
            echo "ANDROID_VERSION_TAG=${{ needs.build.outputs.android_version_tag }}"
          } >> "$GITHUB_ENV"
      - name: Sign target files
        working-directory: /mnt/src/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . build/envsetup.sh
          V="user"; [ "${{ github.event.inputs.debug_build || 'false' }}" = "true" ] && V="userdebug"
          lunch "treble_arm64_bvN-${ANDROID_VERSION_TAG}-${V}"
          bash vendor/cawilliamson-priv/keys/sign.sh
          rm -fv "${OUT}/system.img"
          unzip -j -q "${OUT}/signed-target_files.zip" IMAGES/system.img -d "${OUT}/"
          rm -fv "${OUT}/signed-target_files.zip"
          mv -v "${OUT}/system.img" "/mnt/src/out/system.img"
      - id: compress
        name: Compress image and generate zsync
        run: |
          TAG="${ANDROID_VERSION}-${BUILD_NUMBER}"
          [ "${{ github.event.inputs.debug_build || 'false' }}" = "true" ] && TAG="${TAG}-debug"
          cd /mnt/src/out
          img="RestlessOS-arm64-ab-${TAG}.img"
          mv -v system.img "${img}"
          mkdir -p zsync
          zsyncmake -o "zsync/${img}.zsync" -u "${img}" -v "${img}"
          cp -v "${img}" "zsync/${img}"
          xz --best --compress --memlimit-compress=0 --threads=0 -v "${img}"
          echo "version_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=RestlessOS-ab-${TAG}" >> "$GITHUB_OUTPUT"
      - name: Generate changelog
        run: |
          TAG="${{ steps.compress.outputs.version_tag }}"
          PREV=$(git tag --sort=-version:refname | grep -v -- '-debug$' | grep -v "^${TAG}$" | head -1)
          [ -n "$PREV" ] && RANGE="${PREV}..HEAD" || RANGE="HEAD"
          { echo "## Changes"; echo ""; git log --format='- %s' --no-merges "${RANGE}"; } > /mnt/src/out/CHANGELOG.md
          cat /mnt/src/out/CHANGELOG.md
      - name: Upload to build.chrisaw.io
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 2
          retry_wait_seconds: 30
          command: |
            R="${{ steps.compress.outputs.release_name }}"
            REMOTE="build.chrisaw.io:/var/www/build.chrisaw.io/${R}"
            rsync -acvz --mkpath --timeout=120 --partial --partial-dir=.rsync-partial /mnt/src/out/*.img.xz /mnt/src/out/CHANGELOG.md "${REMOTE}/"
            rsync -acvz --mkpath --timeout=120 --partial --partial-dir=.rsync-partial /mnt/src/out/zsync/ "${REMOTE}/zsync/"
      - if: github.event.inputs.debug_build != 'true'
        name: Publish GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.compress.outputs.version_tag }}
          name: "RestlessOS ${{ steps.compress.outputs.version_tag }}"
          bodyFile: /mnt/src/out/CHANGELOG.md
          artifacts: "/mnt/src/out/*.img.xz"
          token: ${{ github.token }}
      - name: Unmount data volume
        run: .github/scripts/ebs.sh umount

  destroy-infrastructure:
    name: Destroy Infrastructure
    needs: [start-sign, sign]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2
      - name: Detach volume and kill sign instance
        run: |
          .github/scripts/ebs.sh detach
          .github/scripts/ec2.sh kill
        env:
          VOLUME_ID: ${{ needs.start-sign.outputs.data_volume_id }}
          EC2_INSTANCE_ID: ${{ needs.start-sign.outputs.instance_id }}
          GH_PAT: ${{ secrets.GH_PAT }}
          RUNNER_LABEL: ${{ needs.start-sign.outputs.label }}
      - name: Destroy infrastructure (OpenTofu)
        uses: dflook/tofu-destroy@v2
        with:
          path: .github/terraform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Kill any remaining instances
        run: |
          for iid in "${{ needs.deploy-infrastructure.outputs.sync_instance_id }}" "${{ needs.start-build.outputs.instance_id }}" "${{ needs.start-sign.outputs.instance_id }}"; do
            [ -z "$iid" ] && continue
            echo "Terminating ${iid} (if still running)..."
            EC2_INSTANCE_ID="$iid" .github/scripts/ec2.sh kill
          done
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          RUNNER_LABEL: ""
      - name: Delete data volume
        run: .github/scripts/ebs.sh delete
        env:
          VOLUME_ID: ${{ needs.deploy-infrastructure.outputs.sync_data_volume_id }}
      - if: always()
        name: Write build summary
        run: |
          {
            echo "## Build Summary"
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Build result | ${{ needs.build.result }} |"
            echo "| Sync | ${{ needs.deploy-infrastructure.outputs.sync_instance_id || 'N/A' }} |"
            echo "| Build | ${{ needs.start-build.outputs.instance_id || 'N/A' }} |"
            echo "| Sign | ${{ needs.start-sign.outputs.instance_id || 'N/A' }} |"
            echo "| Infrastructure | ${{ needs.deploy-infrastructure.result }} / destroyed: ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
