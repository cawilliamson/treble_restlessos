name: Build RestlessOS GSI

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'release channel for auto-detection (stable/beta/alpha)'
        required: false
        default: 'stable'
      debug_build:
        description: 'enable debug patches (verbose logging, open logcat) -- do not ship'
        required: false
        type: boolean
        default: false
      _retry_attempt:
        description: 'internal: spot retry counter (do not set manually)'
        required: false
        default: '0'

permissions:
  actions: write
  contents: write

# only one build at a time - spot instances are expensive
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # job 1: provision
  # runs on a free github-hosted runner. launches an EC2 spot instance,
  # registers it as an ephemeral self-hosted runner, and waits for it to
  # come online.
  # ---------------------------------------------------------------------------
  provision:
    name: Provision EC2 Spot Instance
    runs-on: ubuntu-latest
    outputs:
      instance_id: ${{ steps.launch.outputs.instance_id }}
      runner_label: ${{ steps.runner_label.outputs.label }}
      region: ${{ steps.launch.outputs.region }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Generate unique runner label
        id: runner_label
        run: |
          LABEL="gsi-build-${{ github.run_id }}"
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"
          echo "Runner label: ${LABEL}"

      - name: Get GitHub Actions runner registration token
        id: runner_token
        run: |
          RESPONSE=$(curl --fail --request POST --silent \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token")
          TOKEN=$(echo "$RESPONSE" | jq --raw-output '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: failed to get runner registration token"
            echo "$RESPONSE" | jq .
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Render cloud-init user-data
        run: |
          SSH_KEY_B64=$(echo "${{ secrets.BUILD_SSH_KEY }}" | base64 --wrap=0)
          REPO_URL="https://github.com/${{ github.repository }}"
          RUNNER_LABEL="${{ steps.runner_label.outputs.label }}"
          RUNNER_TOKEN="${{ steps.runner_token.outputs.token }}"

          sed \
            --expression "s|__REPO_URL__|${REPO_URL}|g" \
            --expression "s|__RUNNER_LABELS__|${RUNNER_LABEL}|g" \
            --expression "s|__RUNNER_TOKEN__|${RUNNER_TOKEN}|g" \
            --expression "s|__SSH_KEY_B64__|${SSH_KEY_B64}|g" \
            .github/cloud-init/user-data.yml \
            > /tmp/user-data.yml

          echo "user-data rendered: $(wc --bytes < /tmp/user-data.yml) bytes"

      - name: Launch EC2 spot instance
        id: launch
        run: |
          # c7i.48xlarge: 192 vCPUs, 384 GiB RAM
          # InstanceInitiatedShutdownBehavior=terminate ensures the cloud-init
          # safety timer (shutdown -P +120) destroys the instance entirely.
          # ephemeral root volume sized for the full build; instance terminates
          # at the end of the job and the volume is deleted with it.

          # Regions to try. Ordered dynamically below by spot price —
          # cheaper region is assumed quieter / more reliable for spot.
          CANDIDATE_REGIONS="eu-west-2 eu-west-1"

          # ------------------------------------------------------------------
          # Phase 0: rank candidate regions by current spot price
          # Lower price ⟹ less demand ⟹ more reliable spot availability
          # ------------------------------------------------------------------
          declare -A REGION_PRICE=()
          for REGION in ${CANDIDATE_REGIONS}; do
            PRICE=$(aws ec2 describe-spot-price-history --region "${REGION}" \
              --instance-types c7i.48xlarge \
              --product-descriptions "Linux/UNIX" \
              --start-time "$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%S)" \
              --query 'SpotPriceHistory[0].SpotPrice' \
              --output text 2>/dev/null) || true

            if [ -n "${PRICE}" ] && [ "${PRICE}" != "None" ]; then
              REGION_PRICE["${REGION}"]="${PRICE}"
              echo "  ${REGION} spot price: ${PRICE}"
            else
              REGION_PRICE["${REGION}"]="99.99"
              echo "  ${REGION} spot price: unavailable (deprioritised)"
            fi
          done

          REGIONS=$(for r in ${CANDIDATE_REGIONS}; do
            echo "${REGION_PRICE[$r]:-99.99} ${r}"
          done | sort -g | awk '{print $2}')
          echo "Region priority (cheapest spot first): ${REGIONS}"

          # ------------------------------------------------------------------
          # Phase 1: discover per-region resources (AMI, SG, subnets)
          # ------------------------------------------------------------------
          declare -A REGION_AMI=()
          declare -A REGION_SG=()
          declare -A REGION_SUBNETS=()

          for REGION in ${REGIONS}; do
            echo "=== Discovering resources in ${REGION} ==="

            AMI_ID=$(aws ec2 describe-images --region "${REGION}" \
              --filters \
                "Name=name,Values=ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-amd64-server-*" \
                "Name=state,Values=available" \
              --output text \
              --owners 099720109477 \
              --query 'Images | sort_by(@, &CreationDate) | [-1].ImageId')

            if [ -z "${AMI_ID}" ]; then
              echo "  No AMI found, skipping region"
              continue
            fi
            echo "  AMI: ${AMI_ID}"
            REGION_AMI["${REGION}"]="${AMI_ID}"

            SG_ID=$(aws ec2 describe-security-groups --region "${REGION}" \
              --filters "Name=group-name,Values=gsi-build" "Name=tag:Project,Values=gsi-build" \
              --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null) || true

            if [ -z "${SG_ID}" ] || [ "${SG_ID}" = "None" ]; then
              echo "  Security group gsi-build not found, skipping region"
              continue
            fi
            echo "  Security group: ${SG_ID}"
            REGION_SG["${REGION}"]="${SG_ID}"

            SUBNET_LIST=""
            while IFS= read -r s; do
              [ -n "$s" ] && SUBNET_LIST="${SUBNET_LIST}${s} "
            done < <(aws ec2 describe-subnets --region "${REGION}" \
              --filters "Name=tag:Project,Values=gsi-build" \
              --query 'Subnets[].SubnetId' --output text | tr '\t' '\n')

            if [ -z "${SUBNET_LIST}" ]; then
              echo "  No subnets found, skipping region"
              continue
            fi
            echo "  Subnets: ${SUBNET_LIST}"
            REGION_SUBNETS["${REGION}"]="${SUBNET_LIST}"
          done

          # Build ordered list of region:subnet pairs for launch attempts.
          # No AZ preference — any subnet in any region is fine.
          declare -a LAUNCH_PAIRS=()
          for REGION in ${REGIONS}; do
            if [ -n "${REGION_AMI[${REGION}]:-}" ]; then
              for SUBNET in ${REGION_SUBNETS[${REGION}]}; do
                LAUNCH_PAIRS+=("${REGION}:${SUBNET}")
              done
            fi
          done

          if [ "${#LAUNCH_PAIRS[@]}" -eq 0 ]; then
            echo "ERROR: no usable regions found (missing AMI, SG, or subnets)"
            exit 1
          fi
          echo "Launch attempt order: ${LAUNCH_PAIRS[*]}"

          # ------------------------------------------------------------------
          # Phase 2: try to launch a spot instance across all region/subnet
          # ------------------------------------------------------------------
          INSTANCE_ID=""
          LAUNCHED_REGION=""
          ATTEMPT=0
          DEADLINE=$((SECONDS + 3600))

          while [ -z "$INSTANCE_ID" ] && [ "$SECONDS" -lt "$DEADLINE" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            for PAIR in "${LAUNCH_PAIRS[@]}"; do
              REGION="${PAIR%%:*}"
              SUBNET="${PAIR##*:}"
              AMI_ID="${REGION_AMI[${REGION}]}"
              SG_ID="${REGION_SG[${REGION}]}"

              echo "Attempt ${ATTEMPT}: trying ${REGION} subnet ${SUBNET}..."
              INSTANCE_ID=$(aws ec2 run-instances --region "${REGION}" \
                --image-id "${AMI_ID}" \
                --instance-initiated-shutdown-behavior terminate \
                --instance-market-options '{"MarketType":"spot","SpotOptions":{"SpotInstanceType":"one-time","InstanceInterruptionBehavior":"terminate"}}' \
                --instance-type c7i.48xlarge \
                --output text \
                --query 'Instances[0].InstanceId' \
                --security-group-ids "${SG_ID}" \
                --subnet-id "${SUBNET}" \
                --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=gsi-build-${{ github.run_id }}},{Key=Project,Value=gsi-build},{Key=Ephemeral,Value=true}]" \
                --block-device-mappings 'DeviceName=/dev/sda1,Ebs={VolumeSize=1000,VolumeType=gp3,Iops=16000,Throughput=1000,DeleteOnTermination=true}' \
                --user-data "file:///tmp/user-data.yml" 2>&1) && {
                  LAUNCHED_REGION="${REGION}"
                  break 2
                }
              echo "  failed: ${INSTANCE_ID}"
              INSTANCE_ID=""
            done

            REMAINING=$(( (DEADLINE - SECONDS) / 60 ))
            echo "All region/subnet combos failed — retrying in 30s (${REMAINING}m remaining)..."
            sleep 30
          done

          if [ -z "${INSTANCE_ID}" ]; then
            echo "ERROR: failed to launch spot instance in any region after 1 hour"
            exit 1
          fi

          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          echo "region=${LAUNCHED_REGION}" >> "$GITHUB_OUTPUT"
          echo "Launched spot instance: ${INSTANCE_ID} (c7i.48xlarge in ${LAUNCHED_REGION})"

      - name: Wait for instance to reach running state
        run: |
          echo "Waiting for instance ${{ steps.launch.outputs.instance_id }} to start..."
          aws ec2 wait instance-running \
            --region "${{ steps.launch.outputs.region }}" \
            --instance-ids "${{ steps.launch.outputs.instance_id }}"
          echo "Instance is running"

      - name: Wait for runner to register with GitHub Actions
        run: |
          LABEL="${{ steps.runner_label.outputs.label }}"
          echo "Waiting for runner with label '${LABEL}' to register..."

          for i in $(seq 1 60); do
            ONLINE=$(curl --fail --silent \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runners" \
              | jq --arg label "$LABEL" --raw-output \
                '[.runners[] | select(.labels[].name == $label) | select(.status == "online")] | length')

            echo "  attempt ${i}/60: ${ONLINE} runner(s) online with label '${LABEL}'"

            if [ "${ONLINE}" -ge 1 ] 2>/dev/null; then
              echo "Runner is online and ready"
              exit 0
            fi
            sleep 15
          done

          echo "ERROR: runner never came online after 15 minutes"
          exit 1

  # ---------------------------------------------------------------------------
  # job 2: build
  # runs DIRECTLY ON the EC2 spot instance via the ephemeral self-hosted
  # runner. all steps execute on the 192-vCPU machine.
  # ---------------------------------------------------------------------------
  build:
    name: Build ROM
    needs: provision
    runs-on: [ self-hosted, "${{ needs.provision.outputs.runner_label }}" ]
    timeout-minutes: 120

    env:
      GH_TOKEN: ${{ github.token }}
      DEBUG_BUILD: ${{ github.event.inputs.debug_build || 'false' }}
      GRAPHENEOS_RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || 'stable' }}
      WEB_DIR: /var/www/build.chrisaw.io
      REPO_PATH: ${{ github.repository }}

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 0
          fetch-tags: true

      - name: Verify gh CLI authentication
        run: gh auth status

      - name: Ensure working directories exist
        run: mkdir --parents out/ src/ tmp/

      - name: Resolve latest GrapheneOS tag
        run: |
          BUILD_DATETIME=$(date "+%s")
          BUILD_NUMBER=$(date "+%Y%m%d%H%M")
          echo "${BUILD_DATETIME}" > tmp/.build_datetime
          echo "${BUILD_NUMBER}" > tmp/.build_number

          echo "Fetching latest ${GRAPHENEOS_RELEASE_CHANNEL} tag from grapheneos.org/releases..."
          RELEASES_HTML=$(curl --fail --silent "https://grapheneos.org/releases")
          TAG=$(echo "${RELEASES_HTML}" \
            | grep --only-matching --perl-regexp "id=[a-z]+-${GRAPHENEOS_RELEASE_CHANNEL}><td>[^<]+</td><td><a href=#\K[0-9]{10}" \
            | sort --numeric-sort --reverse | head --lines=1)
          if [ -z "${TAG}" ]; then
            echo "ERROR: failed to extract a valid ${GRAPHENEOS_RELEASE_CHANNEL} tag"
            exit 1
          fi
          echo "Resolved latest ${GRAPHENEOS_RELEASE_CHANNEL} tag: ${TAG}"
          echo "${TAG}" > tmp/.grapheneos_tag

      - name: Sync sources
        working-directory: src/
        run: |
          GRAPHENEOS_TAG=$(cat ../tmp/.grapheneos_tag)
          echo "Initialising from tag: ${GRAPHENEOS_TAG}"
          repo init --depth=1 --git-lfs \
            --manifest-branch "refs/tags/${GRAPHENEOS_TAG}" \
            --manifest-url https://github.com/GrapheneOS/platform_manifest.git
          mkdir --parents .repo/local_manifests
          cp --verbose ../configs/manifests/*.xml .repo/local_manifests/
          SYNC_JOBS=$(( $(nproc --all) > 100 ? 100 : $(nproc --all) ))
          while ! repo sync --force-sync --jobs=${SYNC_JOBS} --no-clone-bundle --no-tags; do
            echo "repo sync failed, retrying in 30s..."
            sleep 30
          done
          AOSP_TAG=$(grep --max-count=1 "aosp_revision:" .repo/manifests/config.yml | sed "s/.*: *//")
          ANDROID_VERSION=$(echo "${AOSP_TAG}" | sed "s/android-//;s/_r.*//")
          echo "Detected ANDROID_VERSION: ${ANDROID_VERSION}"
          echo "${ANDROID_VERSION}" > ../tmp/.android_version
          ANDROID_VERSION_TAG=$(grep --max-count=1 "target:" build/release/release_config_map.textproto \
            | sed "s/.*\"\([^\"]*\)\".*/\1/")
          echo "Detected ANDROID_VERSION_TAG: ${ANDROID_VERSION_TAG}"
          echo "${ANDROID_VERSION_TAG}" > ../tmp/.android_version_tag

      - name: Sync vendored repos
        working-directory: src/
        run: |
          echo "Syncing vendored repos..."
          for dir in device treble_app vendor; do
            echo "  vendor/${dir} -> src/${dir}"
            rm -rf "${dir}"
            cp -r ../vendor/"${dir}" "${dir}"
          done
          echo "Done."

      - name: Apply patches
        working-directory: src/
        run: |
          ../patches/apply.sh . trebledroid
          ../patches/apply.sh . trebledroid-staging
          ../patches/apply.sh . rom
          ../patches/apply.sh . personal
          if [ "${DEBUG_BUILD}" = "true" ]; then
            echo "*** DEBUG BUILD: applying debug-builds tier ***"
            ../patches/apply.sh . debug-builds
          else
            echo "*** RELEASE BUILD: applying release-builds tier ***"
            ../patches/apply.sh . release-builds
          fi

      - name: Build TrebleApp
        working-directory: src/treble_app
        run: bash build.sh release

      - name: Build ROM image
        working-directory: src/
        run: |
          ANDROID_VERSION_TAG_VAL=$(cat ../tmp/.android_version_tag)
          pushd device/phh/treble
            cp --force --verbose ../../../../configs/rom/rom.mk .
            bash generate.sh rom
          popd
          . build/envsetup.sh
          BUILD_VARIANT="user"
          if [ "${DEBUG_BUILD}" = "true" ]; then
            BUILD_VARIANT="userdebug"
          fi
          lunch "treble_arm64_bvN-${ANDROID_VERSION_TAG_VAL}-${BUILD_VARIANT}"
          make systemimage -j"$(nproc --all)"
          make target-files-package otatools -j"$(nproc --all)"

      - name: Sign ROM image
        working-directory: src/
        run: |
          ANDROID_VERSION_TAG_VAL=$(cat ../tmp/.android_version_tag)
          . build/envsetup.sh
          BUILD_VARIANT="user"
          if [ "${DEBUG_BUILD}" = "true" ]; then
            BUILD_VARIANT="userdebug"
          fi
          lunch "treble_arm64_bvN-${ANDROID_VERSION_TAG_VAL}-${BUILD_VARIANT}"
          bash vendor/cawilliamson-priv/keys/sign.sh
          rm --force --verbose "${OUT}/system.img"
          unzip -joq "${OUT}/signed-target_files.zip" IMAGES/system.img -d "${OUT}/"
          rm --force --verbose "${OUT}/signed-target_files.zip"
          mv --verbose "${OUT}/system.img" ../tmp/system.img

      - name: Compress ROM image
        id: compress
        run: |
          ANDROID_VERSION=$(cat tmp/.android_version)
          BUILD_NUMBER=$(cat tmp/.build_number)
          VERSION_TAG="${ANDROID_VERSION}-${BUILD_NUMBER}"
          if [ "${DEBUG_BUILD}" = "true" ]; then
            VERSION_TAG="${VERSION_TAG}-debug"
          fi
          cd tmp/
          img="RestlessOS-arm64-ab-${VERSION_TAG}.img"
          mv --verbose system.img "${img}"
          mkdir --parents ../out/zsync
          zsyncmake -o "../out/zsync/${img}.zsync" -u "${img}" -v "${img}"
          cp --verbose "${img}" "../out/zsync/${img}"
          xz -9 --compress --memlimit-compress=0 --threads=0 --verbose "${img}"
          cp --force --verbose "${img}.xz" ../out/
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=RestlessOS-ab-${VERSION_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          VERSION_TAG="${{ steps.compress.outputs.version_tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v -- '-debug$' | grep -v "^${VERSION_TAG}$" | head -1)
          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..HEAD"
            HEADER="Changes since ${PREV_TAG}"
          else
            RANGE="HEAD"
            HEADER="Changes"
          fi
          {
            echo "## ${HEADER}"
            echo ""
            git log --format='- %s' --no-merges "${RANGE}"
          } > out/CHANGELOG.md
          cat out/CHANGELOG.md

      - name: Upload artifacts to build.chrisaw.io
        run: |
          RELEASE_NAME="${{ steps.compress.outputs.release_name }}"
          rsync --archive --compress --mkpath --verbose \
            out/*.img.xz out/CHANGELOG.md \
            "build.chrisaw.io:/var/www/build.chrisaw.io/${RELEASE_NAME}/"
          rsync --archive --compress --mkpath --verbose \
            out/zsync/ \
            "build.chrisaw.io:/var/www/build.chrisaw.io/${RELEASE_NAME}/zsync/"

      - name: Create GitHub release
        if: env.DEBUG_BUILD != 'true'
        run: |
          VERSION_TAG="${{ steps.compress.outputs.version_tag }}"
          RELEASE_NAME="${{ steps.compress.outputs.release_name }}"
          echo "" >> out/CHANGELOG.md
          echo "Download mirror: https://build.chrisaw.io/${RELEASE_NAME}/" >> out/CHANGELOG.md
          cd out/
          gh release create \
            --notes-file CHANGELOG.md \
            --title "RestlessOS ${VERSION_TAG}" \
            "${VERSION_TAG}" \
            ./*.img.xz


  # ---------------------------------------------------------------------------
  # job 3: teardown
  # always runs - terminates the EC2 instance and removes the runner.
  # the cloud-init shutdown timer is the backup if this job fails.
  # ---------------------------------------------------------------------------
  teardown:
    name: Terminate EC2 Instance
    needs: [ provision, build ]
    runs-on: ubuntu-latest
    if: always()
    outputs:
      spot_interrupted: ${{ steps.check_spot.outputs.spot_interrupted }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.provision.outputs.region || 'eu-west-2' }}

      - name: Check for spot interruption
        id: check_spot
        env:
          INSTANCE_ID: ${{ needs.provision.outputs.instance_id }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "spot_interrupted=false" >> "$GITHUB_OUTPUT"

          if [ -z "${INSTANCE_ID}" ] || { [ "${BUILD_RESULT}" != "failure" ] && [ "${BUILD_RESULT}" != "cancelled" ]; }; then
            echo "Build did not fail (result=${BUILD_RESULT}) or no instance — skipping spot check"
            exit 0
          fi

          # spot termination is asynchronous: the runner process dies immediately
          # but the EC2 instance can stay in "running" state for up to 2 minutes
          # before AWS transitions it to shutting-down/terminated. poll for up
          # to 120 seconds to catch the state transition.
          echo "Build failed — checking if spot instance was reclaimed..."
          for i in $(seq 1 12); do
            STATE=$(aws ec2 describe-instances \
              --region "${{ needs.provision.outputs.region || 'eu-west-2' }}" \
              --instance-ids "${INSTANCE_ID}" \
              --query 'Reservations[0].Instances[0].State.Name' \
              --output text 2>/dev/null || echo "unknown")

            REASON=$(aws ec2 describe-instances \
              --region "${{ needs.provision.outputs.region || 'eu-west-2' }}" \
              --instance-ids "${INSTANCE_ID}" \
              --query 'Reservations[0].Instances[0].StateReason.Code' \
              --output text 2>/dev/null || echo "unknown")

            echo "  poll ${i}/12: state=${STATE} reason=${REASON}"

            if [ "${REASON}" = "Server.SpotInstanceTermination" ]; then
              echo "::warning::Spot instance was reclaimed by AWS"
              echo "spot_interrupted=true" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "${STATE}" = "terminated" ] || [ "${STATE}" = "shutting-down" ]; then
              echo "::warning::Instance was terminated externally (probable spot reclamation)"
              echo "spot_interrupted=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 10
          done

          # instance is still running after 120 seconds — not a spot interruption
          echo "Instance still running after 2 minutes — not a spot interruption"
          echo "Final state: ${STATE}, reason: ${REASON}"

      - name: Terminate instance
        env:
          INSTANCE_ID: ${{ needs.provision.outputs.instance_id }}
        run: |
          if [ -z "${INSTANCE_ID}" ] || [ "${INSTANCE_ID}" = "" ]; then
            echo "No instance ID found - nothing to terminate"
            exit 0
          fi

          echo "Terminating instance ${INSTANCE_ID}..."
          aws ec2 terminate-instances --region "${{ needs.provision.outputs.region || 'eu-west-2' }}" --instance-ids "${INSTANCE_ID}"
          echo "Terminate request sent"

      - name: Wait for instance termination
        env:
          INSTANCE_ID: ${{ needs.provision.outputs.instance_id }}
        run: |
          if [ -z "${INSTANCE_ID}" ] || [ "${INSTANCE_ID}" = "" ]; then
            exit 0
          fi

          echo "Waiting for instance ${INSTANCE_ID} to terminate..."
          aws ec2 wait instance-terminated \
            --region "${{ needs.provision.outputs.region || 'eu-west-2' }}" \
            --instance-ids "${INSTANCE_ID}" \
            || echo "WARNING: wait timed out, instance may still be terminating"

          STATE=$(aws ec2 describe-instances \
            --region "${{ needs.provision.outputs.region || 'eu-west-2' }}" \
            --instance-ids "${INSTANCE_ID}" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text 2>/dev/null || echo "unknown")

          if [ "$STATE" = "terminated" ] || [ "$STATE" = "shutting-down" ]; then
            echo "Confirmed: instance ${INSTANCE_ID} is ${STATE}"
          else
            echo "::error::Instance ${INSTANCE_ID} is in state '${STATE}' - may still be running!"
            echo "::error::MANUAL ACTION REQUIRED: https://${{ needs.provision.outputs.region || 'eu-west-2' }}.console.aws.amazon.com/ec2"
            exit 1
          fi

      - name: Remove ephemeral runner from GitHub
        env:
          RUNNER_LABEL: ${{ needs.provision.outputs.runner_label }}
        run: |
          RUNNER_ID=$(curl --fail --silent \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners" \
            | jq --arg label "${RUNNER_LABEL}" --raw-output \
              '.runners[] | select(.labels[].name == $label) | .id' \
            | head --lines=1)

          if [ -n "$RUNNER_ID" ] && [ "$RUNNER_ID" != "null" ]; then
            curl --fail --request DELETE --silent \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runners/${RUNNER_ID}"
            echo "Removed runner ${RUNNER_ID} from GitHub"
          else
            echo "Runner already removed (ephemeral runners deregister themselves on exit)"
          fi

      - name: Build summary
        if: always()
        run: |
          BUILD_RESULT="${{ needs.build.result }}"
          SPOT_HIT="${{ steps.check_spot.outputs.spot_interrupted }}"
          ATTEMPT="${{ github.event.inputs._retry_attempt || '0' }}"
          {
            echo "## Build Summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Build result | ${BUILD_RESULT} |"
            echo "| Spot interrupted | ${SPOT_HIT} |"
            echo "| Attempt | $((ATTEMPT + 1)) of 5 |"
            echo "| Instance ID | ${{ needs.provision.outputs.instance_id }} |"
            echo "| Instance type | c7i.48xlarge (192 vCPUs) |"
            echo "| Region | ${{ needs.provision.outputs.region || 'eu-west-2' }} |"
            echo "| Runner label | ${{ needs.provision.outputs.runner_label }} |"
            echo "| Instance terminated | yes |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # job 4: retry on spot interruption
  # if the build failed because AWS reclaimed the spot instance, re-trigger
  # the workflow automatically (up to 5 attempts).
  # ---------------------------------------------------------------------------
  retry:
    name: Retry on Spot Interruption
    needs: [ teardown ]
    runs-on: ubuntu-latest
    if: always() && needs.teardown.outputs.spot_interrupted == 'true'

    steps:
      - name: Check retry budget
        id: budget
        run: |
          ATTEMPT="${{ github.event.inputs._retry_attempt || '0' }}"
          NEXT=$((ATTEMPT + 1))
          echo "Current attempt: $((ATTEMPT + 1)), next would be: $((NEXT + 1))"
          if [ "${NEXT}" -ge 5 ]; then
            echo "::error::Spot retry budget exhausted (5 attempts). Giving up."
            echo "has_budget=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_budget=true" >> "$GITHUB_OUTPUT"
            echo "next_attempt=${NEXT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-trigger workflow
        if: steps.budget.outputs.has_budget == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEXT="${{ steps.budget.outputs.next_attempt }}"
          echo "::warning::Spot instance was reclaimed — retrying (attempt $((NEXT + 1)) of 5)..."
          gh workflow run build.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref }}" \
            --field release_channel="${{ github.event.inputs.release_channel || 'stable' }}" \
            --field debug_build="${{ github.event.inputs.debug_build || 'false' }}" \
            --field _retry_attempt="${NEXT}"
