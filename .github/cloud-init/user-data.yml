#cloud-config
#
# grapheneos GSI - ephemeral github actions runner bootstrap (AWS EC2)
#
# placeholders replaced by the GHA "provision" job before sending to EC2:
#   __RUNNER_TOKEN__   - one-time GHA runner registration token
#   __RUNNER_LABELS__  - comma-separated labels for this runner
#   __REPO_URL__       - https://github.com/OWNER/REPO
#   __SSH_KEY_B64__    - base64-encoded BUILD_SSH_KEY private key

package_update: true
package_upgrade: false

packages:
  - bc
  - bison
  - build-essential
  - ccache
  - curl
  - flex
  - g++-multilib
  - gcc-multilib
  - git
  - git-lfs
  - gnupg
  - gperf
  - imagemagick
  - jq
  - lib32readline-dev
  - lib32z1-dev
  - liblz4-tool
  - libssl-dev
  - libxml2
  - libxml2-utils
  - lzop
  - openjdk-11-jdk
  - pngcrush
  - python3
  - rsync
  - schedtool
  - squashfs-tools
  - unzip
  - wget
  - xsltproc
  - xz-utils
  - zip
  - zlib1g-dev
  - zsync

users:
  - default
  - name: github
    shell: /bin/bash
    groups: [sudo]
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    home: /home/github

write_files:
  - path: /etc/systemd/system/actions-runner.service
    permissions: '0644'
    content: |
      [Unit]
      Description=GitHub Actions Runner
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=github
      WorkingDirectory=/opt/actions-runner
      ExecStart=/opt/actions-runner/run.sh
      Restart=no
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

runcmd:
  # -------------------------------------------------------------------------
  # SAFETY TIMER - armed first, always.
  # shuts the instance down after 2 hours regardless of anything else.
  # with InstanceInitiatedShutdownBehavior=terminate, this destroys the
  # instance entirely - no orphaned resources, no surprise bills.
  # -------------------------------------------------------------------------
  - "shutdown -P +120 'SAFETY: 2-hour maximum build time reached. self-destructing.'"

  # -------------------------------------------------------------------------
  # SSH key + config — created here because write_files runs before users
  # -------------------------------------------------------------------------
  - |
    mkdir -p /home/github/.ssh
    echo "__SSH_KEY_B64__" | base64 -d > /home/github/.ssh/build_key
    chmod 600 /home/github/.ssh/build_key
    ssh-keygen -y -f /home/github/.ssh/build_key > /home/github/.ssh/build_key.pub
    cat > /home/github/.ssh/config <<'EOF'
    Host github.com
      IdentityFile /home/github/.ssh/build_key
      StrictHostKeyChecking no
      User git

    Host build.chrisaw.io
      IdentityFile /home/github/.ssh/build_key
      StrictHostKeyChecking no
      User chrisaw
    EOF
    chmod 600 /home/github/.ssh/config
    chown -R github:github /home/github/.ssh

  # -------------------------------------------------------------------------
  # libncurses5 - not in ubuntu 24.04 repos, required by AOSP host tools
  # -------------------------------------------------------------------------
  - |
    cd /var/tmp
    curl -sf -O http://launchpadlibrarian.net/648013231/libtinfo5_6.4-2_amd64.deb
    dpkg -i libtinfo5_6.4-2_amd64.deb
    curl -sf -LO http://launchpadlibrarian.net/648013227/libncurses5_6.4-2_amd64.deb
    dpkg -i libncurses5_6.4-2_amd64.deb
    rm -f ./*.deb

  # -------------------------------------------------------------------------
  # repo tool
  # -------------------------------------------------------------------------
  - |
    curl -sf -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
    chmod a+x /usr/local/bin/repo

  # -------------------------------------------------------------------------
  # github CLI - for creating releases
  # -------------------------------------------------------------------------
  - |
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
      | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
    chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
      > /etc/apt/sources.list.d/github-cli.list
    apt-get update -qq && apt-get install -y gh

  # -------------------------------------------------------------------------
  # git identity (required for patch application via git am)
  # -------------------------------------------------------------------------
  - |
    sudo -u github git config --global user.email 'androidbuild@localhost'
    sudo -u github git config --global user.name 'androidbuild'
    sudo -u github git config --global color.ui false

  # -------------------------------------------------------------------------
  # github actions runner - install, configure, start via systemd
  #
  # when booting from a snapshot-based volume, the runner binaries and old
  # config may already exist.  clean stale state so config.sh runs fresh.
  # -------------------------------------------------------------------------
  - |
    rm -rf /opt/actions-runner/.runner /opt/actions-runner/.credentials* /opt/actions-runner/_diag
    systemctl stop actions-runner.service 2>/dev/null || true
    RUNNER_VERSION=$(curl -sf https://api.github.com/repos/actions/runner/releases/latest \
      | jq -r '.tag_name' | sed 's/^v//')
    INSTALLED_VERSION=$(/opt/actions-runner/run.sh --version 2>/dev/null || echo none)
    if [ ! -f /opt/actions-runner/run.sh ] || [ "$INSTALLED_VERSION" != "$RUNNER_VERSION" ]; then
      mkdir -p /opt/actions-runner
      curl -sf -L \
        "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz" \
        | tar -xz -C /opt/actions-runner
      /opt/actions-runner/bin/installdependencies.sh
    fi
    chown -R github:github /opt/actions-runner

  - |
    cd /opt/actions-runner
    sudo -u github ./config.sh \
      --url "__REPO_URL__" \
      --token "__RUNNER_TOKEN__" \
      --name "aws-gsi-build-$(hostname)" \
      --labels "__RUNNER_LABELS__" \
      --work /home/github/actions-runner-work \
      --unattended \
      --ephemeral

  - |
    systemctl daemon-reload
    systemctl enable --now actions-runner.service
    echo "GitHub Actions runner started via systemd"
